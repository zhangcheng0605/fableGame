    ],

      'concatenated', 'sanitization', 'misalignment', 'overwritten',
      'heapcorrupt', 'hexadecimal', 'deadlocking'
    ]
  };

  // Self-validating pass: enforce band, charset, lowercase, and global uniqueness.
  const legal = /^[a-z0-9 '=-]+$/;
  const seen = Object.create(null);
  const out = {};
  const order = ['token', 'halluc', 'jail', 'swarm', 'overflow'];
  for (let i = 0; i < order.length; i++) {
    const type = order[i];
    const band = PI.TUNING.enemy[type].len;
    const list = [];
    const src = raw[type];
    for (let j = 0; j < src.length; j++) {
      const w = String(src[j]).toLowerCase();
      if (w.length < band[0] || w.length > band[1]) continue;  // band violation
      if (!legal.test(w)) continue;                            // untypeable
      if (seen[w]) continue;                                   // cross-pool dup
      seen[w] = 1;
      list.push(w);
    }
    out[type] = list;
  }
  return out;
})();

// 05-util.js — PI.U : pure, allocation-light math / easing / random / glyph helpers.
// Only assignments onto PI. Everything private lives inside the IIFE.
PI.U = (function () {

  // ---------------------------------------------------------------- glyph sets
  // Dense code-ish set for the falling code-rain (latin, digits, brackets,
  // operators + a few half-width katakana for the Matrix flavour).
  // Half-width katakana is used deliberately: full-width forms break the
  // monospace column grid the rain is drawn on.
  const ASCII_GLYPHS =
    'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789' +
    '{}[]()<>/\\|!@#$%^&*+-=_~;:.,?\'"`';
  const KATAKANA = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ';
  const GLYPHS = ASCII_GLYPHS + KATAKANA;
  // scramble/decode uses the ascii-only subset so every substituted character
  // is guaranteed the same advance width as the letter it stands in for.
  const SCRAMBLE_SET = ASCII_GLYPHS;

  // ---------------------------------------------------------------- random
  function rand(a, b) { if (b === undefined) { b = a; a = 0; } return a + Math.random() * (b - a); }
  function randInt(a, b) { if (b === undefined) { b = a; a = 0; } return Math.floor(a + Math.random() * (b - a + 1)); }
  function pick(arr) { return (arr && arr.length) ? arr[(Math.random() * arr.length) | 0] : undefined; }
  function chance(p) { return Math.random() < p; }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  // weightFn(item, index) -> non-negative weight. Returns undefined for empty input.
  function weightedPick(items, weightFn) {
    if (!items || !items.length) return undefined;
    let total = 0;
    for (let i = 0; i < items.length; i++) {
      const w = weightFn ? weightFn(items[i], i) : (items[i] && items[i].weight) || 0;
      if (w > 0) total += w;
    }
    if (total <= 0) return items[(Math.random() * items.length) | 0];
    let r = Math.random() * total;
    for (let i = 0; i < items.length; i++) {
      const w = weightFn ? weightFn(items[i], i) : (items[i] && items[i].weight) || 0;
      if (w <= 0) continue;
      r -= w;
      if (r <= 0) return items[i];
    }
    return items[items.length - 1];
  }

  // ---------------------------------------------------------------- math
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  // frame-rate independent exponential smoothing toward b

/* ==== 10-core.js ==== */
// 10-core.js — PI.Core : the engine floor.
// Owns the canvas + DOM, letterbox scaling, the clamped fixed-timestep loop, the
// state machine, camera juice (trauma shake / hitstop / time-scale / punch / flash),

  const T = PI.TUNING, V = T.view, J = T.juice;

  let needResize = true, rafId = 0, lastT = 0;

      fps: function () { return fps; },
      score: function () { return PI.Score ? PI.Score.value : 0; },
      combo: function () { return PI.Score ? PI.Score.combo : 0; },
      flow: function () { return !!(PI.Score && PI.Score.flow); },
      integrity: function () { return PI.Game ? PI.Game.integrity : 0; },
      wave: function () { return PI.Entities ? PI.Entities.wave : 0; },
      boss: function () { return !!(PI.Entities && PI.Entities.boss); },

  function autoPause() {
    if (state !== 'PLAYING') return;
    resumeState = 'PLAYING';
    pausedByBlur = true;
    api.pausedByBlur = true;
    swallowNext = true;               // §14: the resuming keystroke is swallowed
    state = 'PAUSED';
    api.state = state;
    if (PI.Game && typeof PI.Game.onState === 'function') PI.Game.onState('PLAYING', 'PAUSED');
  }

  function resumeFromBlur() {
    if (state !== 'PAUSED' || !pausedByBlur) return false;
    pausedByBlur = false;
    api.pausedByBlur = false;
    setState(resumeState || 'PLAYING');
    return true;
  }

  // ---------------------------------------------------------------- input
  function kickAudio() {
    if (audioKicked) return;
    audioKicked = true;
    // §13: one shared AudioContext, created inside a user gesture. Audio.init()
    // is contracted to be idempotent, so Input may also call it harmlessly.
    try { if (PI.Audio && typeof PI.Audio.init === 'function') PI.Audio.init(); } catch (_) { }
  }

  function onKeyDown(e) {
    if (!e) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;      // leave browser shortcuts alone
    let k = e.key;
    if (typeof k !== 'string') return;
    if (k === 'Spacebar') k = ' ';                        // legacy key name
    if (k === 'Esc') k = 'Escape';

    hasFocus = true; api.hasFocus = true;
    kickAudio();

    const printable = (k.length === 1 && PRINTABLE.test(k));
    const isEnter = (k === 'Enter');
    const isEsc = (k === 'Escape');
    if (printable || isEnter || isEsc) {
      // stop space/enter from scrolling or activating the host page
      if (typeof e.preventDefault === 'function') e.preventDefault();
    } else {
      return;
    }
    if (e.repeat) return;                                 // auto-repeat is not a keystroke

    if (swallowNext) { swallowNext = false; resumeFromBlur(); return; }
    if (state === 'PAUSED' && pausedByBlur) { resumeFromBlur(); return; }

    const In = PI.Input;
    if (!In) return;
    if (printable) { if (typeof In.key === 'function') In.key(k.toLowerCase()); return; }
    if (isEnter) { if (typeof In.enter === 'function') In.enter(); return; }
    if (typeof In.escape === 'function') In.escape();
  }

  function focusSelf() {
    try {
      if (canvas && canvas.focus) canvas.focus({ preventScroll: true });
    } catch (_) {
      try { canvas.focus(); } catch (_2) { /* ignore */ }
    }
    try { if (typeof window !== 'undefined' && window.focus) window.focus(); } catch (_) { }
    hasFocus = true; api.hasFocus = true;
  }

  function onPointerDown() { focusSelf(); kickAudio(); }
  function onFocus() { hasFocus = true; api.hasFocus = true; }
  function onBlur() { hasFocus = false; api.hasFocus = false; autoPause(); }
  function onVisibility() {
    let hidden = false;
    try { hidden = !!document.hidden; } catch (_) { hidden = false; }
    if (hidden) { hasFocus = false; api.hasFocus = false; autoPause(); }
  }
  function onResize() { needResize = true; }

  function detectTouchOnly() {
    try {
      const nav = (typeof navigator !== 'undefined') ? navigator : null;
      const pts = (nav && typeof nav.maxTouchPoints === 'number') ? nav.maxTouchPoints : 0;
      let fine = false;
      if (typeof window !== 'undefined' && window.matchMedia) {
        const mm = window.matchMedia('(pointer:fine)');
        fine = !!(mm && mm.matches);
      }
      return pts > 0 && !fine;
    } catch (_) { return false; }
  }

  function installListeners() {
    if (listening || typeof window === 'undefined') return;
    listening = true;
    window.addEventListener('keydown', onKeyDown, false);
    window.addEventListener('resize', onResize, false);
    window.addEventListener('orientationchange', onResize, false);
    window.addEventListener('focus', onFocus, false);
    window.addEventListener('blur', onBlur, false);
    window.addEventListener('pointerdown', onPointerDown, true);
    try { window.addEventListener('touchstart', onPointerDown, { passive: true }); } catch (_) { }
    try { document.addEventListener('visibilitychange', onVisibility, false); } catch (_) { }
    if (typeof ResizeObserver !== 'undefined') {
      try { new ResizeObserver(onResize).observe(canvas); } catch (_) { }
    }
  }

  // ---------------------------------------------------------------- draw
  // PI.Game.draw()'s documented order ends with PI.Render.overlay, and Core is
  // also contracted to draw the CRT hook. Wrapping overlay once makes it run
  // exactly once per frame whichever side calls it (no doubled scanlines).
  function hookOverlay() {
    if (overlayHooked) return;
    const R = PI.Render;
    if (!R || typeof R.overlay !== 'function') return;
    overlayHooked = true;
    const orig = R.overlay;
    R.overlay = function (c) {
      if (overlayFrame === frame) return;
      overlayFrame = frame;
      return orig.call(R, c || ctx);
    };
  }

  function drawFlashes(c) {
    let any = false;
    for (let i = 0; i < flashes.length; i++) { if (flashes[i].active) { any = true; break; } }
    if (!any) return;
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < flashes.length; i++) {
      const f = flashes[i];
      if (!f.active) continue;
      const p = f.dur > 0 ? PI.U.clamp(f.t / f.dur, 0, 1) : 1;
      const a = f.a * (1 - PI.U.easeOutCubic(p));
      if (a <= 0.002) continue;
      c.globalAlpha = a;
      c.fillStyle = f.color;
      c.fillRect(0, 0, W, H);
    }
    c.restore();
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';
  }

  function draw() {
    if (!ctx || !canvas) return;
    const s = scale * dpr;
    // black letterbox bars over the entire backing store
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // logical 1280x720 viewport, clipped so nothing bleeds into the bars
    ctx.setTransform(s, 0, 0, s, offX * dpr, offY * dpr);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.clip();
    ctx.fillStyle = PI.C.bg;
    ctx.fillRect(0, 0, W, H);
    // camera: zoom punch about the centre + trauma shake
    ctx.save();
    const z = 1 + punchZoom();
    if (z !== 1) {
      ctx.translate(W * 0.5, H * 0.5);
      ctx.scale(z, z);
      ctx.translate(-W * 0.5, -H * 0.5);
    }
    if (shake.x !== 0 || shake.y !== 0) ctx.translate(shake.x, shake.y);
    if (PI.Game && typeof PI.Game.draw === 'function') PI.Game.draw();
    ctx.restore();
    // overlays live in stable logical space (they must not shake with the world)
    drawFlashes(ctx);
    if (PI.Render && typeof PI.Render.overlay === 'function') PI.Render.overlay(ctx);
    ctx.restore();
  }

  // ---------------------------------------------------------------- loop
  function frameStep(ts) {
    rafId = raf(frameStep);        // re-armed first: a throw below can't kill the loop
    frame++;

    const nowS = (typeof ts === 'number' && isFinite(ts)) ? ts / 1000 : PI.U.now();
    let rawUn = nowS - lastT;
    lastT = nowS;
    if (!(rawUn > 0)) rawUn = 1 / 60;
    if (rawUn > 0 && rawUn < 0.5) fps = fps * FPS_SMOOTH + (1 / rawUn) * (1 - FPS_SMOOTH);
    const raw = rawUn > DT_CLAMP ? DT_CLAMP : rawUn;   // §14: 50ms clamp
    realTime += raw;

    if (((typeof window !== 'undefined' && window.devicePixelRatio) || 1) !== dprSeen) needResize = true;
    if (needResize) { needResize = false; resize(); }

    updateTimeScale(raw);
    const stopped = hitstopT > 0;
    if (stopped) hitstopT = Math.max(0, hitstopT - raw);
    const dt = stopped ? 0 : raw * timeScale;
    const camDt = stopped ? 0 : raw;

    time += dt;
    updateCamera(camDt);

    api.dt = dt; api.time = time; api.realTime = realTime;
    api.timeScale = timeScale; api.fps = fps; api.frame = frame;

    hookOverlay();
    // Some Game implementations set the opening state inside boot(), where
    // setState('TITLE') is a no-op because Core already starts in TITLE. Fire one
    // synthetic entry event so the title screen always gets its onState call.
    if (!initialStateFired) {
      initialStateFired = true;
      if (PI.Game && typeof PI.Game.onState === 'function') PI.Game.onState(null, state);
    }
    if (PI.Game && typeof PI.Game.update === 'function') PI.Game.update(dt);
    draw();
  }

  function start() {
    if (running) return;
    running = true;
    lastT = PI.U.now();
    rafId = raf(frameStep);
  }

  // ---------------------------------------------------------------- boot
  function boot() {
    if (booted) return api;
    booted = true;
    installErrorHooks();
    installDebug();
    if (typeof document === 'undefined') return api;
    makeCanvas();
    api.canvas = canvas;
    api.ctx = ctx;
    styleHost();
    attach();
    resize();
    installListeners();
    api.isTouchOnly = detectTouchOnly();
    try { hasFocus = (document.hasFocus ? !!document.hasFocus() : true); } catch (_) { hasFocus = true; }
    api.hasFocus = hasFocus;
    start();
    return api;
  }

  const api = {
    // surfaces
    canvas: null, ctx: null, W: W, H: H,
    // clock
    time: 0, dt: 0, realTime: 0, frame: 0, fps: 60,
    timeScale: 1,
    // camera
    trauma: 0, shake: shake,
    // machine
    state: state, pausedByBlur: false,
    // environment
    hasFocus: true, isTouchOnly: false,
    scale: 1, dpr: 1, cssW: W, cssH: H, offX: 0, offY: 0,
    // api
    setState: setState,
    setTimeScale: setTimeScale,
    hitstop: hitstop,
    addTrauma: addTrauma,
    punch: punch,
    flash: flash,
    resize: resize,
    focus: focusSelf,
    boot: boot
  };
  // PI.Core.hitstop is the method (per contract); the remaining freeze time is
  // readable as PI.Core.hitstopT for anything that wants to know.
  Object.defineProperty(api, 'hitstopT', { get: function () { return hitstopT; } });

  installErrorHooks();
  installDebug();

  return api;
})();

/* ==== 20-fx.js ==== */
// 20-fx.js — PI.FX : the entire particle / effect layer (DESIGN.md §11 + §11.5).
//
// Design constraints honoured here:
//  * ONE flat pool of particle records (kind tag + union of fields) reused across
//    every kind, plus small dedicated pools for beams / popups / rings.
//    Everything is pre-allocated at load: 900 particles, 64 beams, 48 popups,
//    32 rings. When a pool is exhausted the OLDEST live record is recycled —
//    we never allocate mid-run.
//  * update() iterates with a manual index and swap-removes dead records.
//  * draw() is a single pass grouped by composite mode: all additive
//    ('lighter') geometry first, then normal-composite text. ctx.font /
//    fillStyle / strokeStyle are only assigned when the value actually changes.
//  * Fade is done with ctx.globalAlpha (a number) instead of building
//    'rgba(...)' strings, so the draw loop allocates nothing.
//  * No ctx.filter, no shadowBlur anywhere — bloom is faked with 2–3 layered
//    strokes of decreasing alpha / increasing width (§11.5 perf guardrail).
PI.FX = (function () {
  const U = PI.U;
  const T  = (PI.TUNING && PI.TUNING.fx)    || {};
  const TS = (PI.TUNING && PI.TUNING.score) || {};
  const TC = (PI.TUNING && PI.TUNING.combo) || {};
  const TB = (PI.TUNING && PI.TUNING.boss)  || {};
  const VIEW = (PI.TUNING && PI.TUNING.view) || { W: 1280, H: 720 };

  const CFG_KILL    = T.killSpark       || {};
  const CFG_LETTER  = T.letterExplosion || {};
  const CFG_RING    = T.ring            || {};
  const CFG_BEAM    = T.beam            || {};
  const CFG_GLYPH   = T.glyph           || {};
  const CFG_CONV    = T.converge        || {};
  const CFG_AFTER   = T.afterimage      || {};
  const CFG_SHARD   = T.shard           || {};
  const CFG_POPUP   = T.popup           || {};

  const TAU = Math.PI * 2;
  const POP_TIME = 0.12;          // §11 scale-pop 1.0 -> 1.4 -> 1.0 over 120ms
  const DISP_DECAY = num(T.displaceDecay, 1.4);
  const WHITE = (PI.C && PI.C.white) || '#e6e6e6';
  const INK   = (PI.C && PI.C.ink)   || '#0a0e14';

  // kind tags. Ordered so that "additive geometry" is a single <= compare.
  const K_SPARK = 0, K_TRAIL = 1, K_GLYPH = 2, K_CONVERGE = 3, K_AFTER = 4;

  // ---------------------------------------------------------------- helpers
  function num(v, d) { return (typeof v === 'number' && isFinite(v)) ? v : d; }
  // Accepts a number, a [lo,hi] pair, or undefined -> falls back to `d`
  // (which may itself be a number or a [lo,hi] pair).
  function rng(v, d) {
    if (typeof v === 'number' && isFinite(v)) return v;
    if (v && v.length >= 2) return U.rand(v[0], v[1]);
    if (typeof d === 'number') return d;
    if (d && d.length >= 2) return U.rand(d[0], d[1]);
    return 0;
  }
  function rngInt(v, d) { return Math.round(rng(v, d)); }

  // ---------------------------------------------------------------- pools
  const P_CAP = Math.max(64, num(T.maxParticles, 900) | 0);
  const BEAM_CAP = 64, POPUP_CAP = 48, RING_CAP = 32;

  function newParticle() {
    return {
      kind: K_SPARK,
      x: 0, y: 0, x0: 0, y0: 0, x1: 0, y1: 0,
      vx: 0, vy: 0, g: 0, drag: 0,
      rot: 0, spin: 0,
      t: 0, life: 1, invLife: 1, delay: 0,
      size: 2, a0: 1, color: WHITE, ch: '', trailLen: 0.03
    };
  }
  function newBeam() {
    return { x0: 0, y0: 0, x1: 0, y1: 0, t: 0, life: 0.03, invLife: 33,
             width: 2.5, bloom: 9, a0: 1, color: WHITE };
  }
  function newPopup() {
    return { x: 0, y: 0, t: 0, life: 0.85, invLife: 1.17, vy: -46,
             size: 20, pop: 1.35, a0: 1, color: WHITE, text: '' };
  }
  function newRing() {
    return { x: 0, y: 0, r: 0, r0: 6, r1: 74, t: 0, life: 0.42, invLife: 2.38,
             width: 3, a0: 1, color: WHITE, strength: 0, disp: null };
  }

  const parts  = new Array(P_CAP);     let pLive = 0;
  const beams  = new Array(BEAM_CAP);  let bLive = 0;
  const popups = new Array(POPUP_CAP); let uLive = 0;
  const rings  = new Array(RING_CAP);  let rLive = 0;
  for (let i = 0; i < P_CAP; i++)     parts[i]  = newParticle();
  for (let i = 0; i < BEAM_CAP; i++)  beams[i]  = newBeam();
  for (let i = 0; i < POPUP_CAP; i++) popups[i] = newPopup();
  for (let i = 0; i < RING_CAP; i++)  rings[i]  = newRing();

  // Live radial-displacement records, read by the background (§11.5).
  const displacements = [];
  const dispFree = new Array(RING_CAP);
  for (let i = 0; i < RING_CAP; i++) dispFree[i] = { x: 0, y: 0, r: 0, strength: 0 };

  // Pool acquisition. Full pool => recycle the most-progressed (oldest) record.
  // Only reachable when live === CAP, so the whole array is live and the scan
  // can never hand back a dead slot.
  function grab(arr, live, cap) {
    if (live < cap) return arr[live];
    let bi = 0, best = -1;
    for (let i = 0; i < cap; i++) {
      const a = arr[i].t * arr[i].invLife;
      if (a > best) { best = a; bi = i; }
    }
    return arr[bi];
  }
  function allocP() { const p = grab(parts, pLive, P_CAP); if (pLive < P_CAP) pLive++; return p; }
  function allocB() { const p = grab(beams, bLive, BEAM_CAP); if (bLive < BEAM_CAP) bLive++; return p; }
  function allocU() { const p = grab(popups, uLive, POPUP_CAP); if (uLive < POPUP_CAP) uLive++; return p; }
  function allocR() {
    const p = grab(rings, rLive, RING_CAP);
    if (rLive < RING_CAP) rLive++; else releaseDisp(p);   // recycled ring: drop its displacement
    return p;
  }

  function swapOut(arr, i, live) { live--; if (i !== live) { const t = arr[i]; arr[i] = arr[live]; arr[live] = t; } return live; }

  function releaseDisp(r) {
    const d = r.disp;
    if (!d) return;
    r.disp = null;
    for (let i = 0; i < displacements.length; i++) {
      if (displacements[i] === d) {
        displacements[i] = displacements[displacements.length - 1];
        displacements.pop();
        break;
      }
    }
    dispFree.push(d);
  }

  // ---------------------------------------------------------------- spawners
  // spark(x,y,{color,count,speed,life,size,spread,angle,gravity,drag,alpha})
  // Additive dot with velocity, drag and fade. `spread` is the total cone width
  // in radians around `angle` (0 = +x, +y is down); omit for a full circle.
  function spark(x, y, o) {
    o = o || {};
    const n = rngInt(o.count, CFG_KILL.count || [12, 18]);
    const color = o.color || WHITE;
    const spread = num(o.spread, TAU);
    const base = num(o.angle, 0);
    const g = num(o.gravity, 0);
    const drag = num(o.drag, 3.4);
    const a0 = num(o.alpha, 1);
    const half = spread * 0.5;
    for (let i = 0; i < n; i++) {
      const p = allocP();
      const ang = (spread >= TAU) ? Math.random() * TAU : base + U.rand(-half, half);
      const sp = rng(o.speed, CFG_KILL.speed || [120, 340]);
      const life = rng(o.life, CFG_KILL.life || [0.28, 0.62]);
      p.kind = K_SPARK;
      p.x = x; p.y = y;
      p.vx = Math.cos(ang) * sp; p.vy = Math.sin(ang) * sp;
      p.g = g; p.drag = drag;
      p.rot = 0; p.spin = 0; p.delay = 0;
      p.t = 0; p.life = life > 0.01 ? life : 0.01; p.invLife = 1 / p.life;
      p.size = num(o.size, num(CFG_KILL.size, 2.6));
      p.a0 = a0; p.color = color; p.ch = '';
    }
  }

  // trail(x,y,{color,vx,vy,life,size,len,drag}) — short additive streak drawn
  // along its own velocity (jailbreak dash streaks, speed lines, flow wake).
  function trail(x, y, o) {
    o = o || {};
    const p = allocP();
    p.kind = K_TRAIL;
    p.x = x; p.y = y;
    p.vx = num(o.vx, U.rand(-40, 40)); p.vy = num(o.vy, U.rand(60, 220));
    p.g = num(o.gravity, 0); p.drag = num(o.drag, 1.6);
    p.rot = 0; p.spin = 0; p.delay = num(o.delay, 0);
    const life = rng(o.life, 0.3);
    p.t = 0; p.life = life > 0.01 ? life : 0.01; p.invLife = 1 / p.life;
    p.size = num(o.size, 2.4);
    p.a0 = num(o.alpha, 1);
    p.color = o.color || WHITE;
    p.ch = '';
    p.trailLen = num(o.len, 0.045);
    return p;
  }

  // glyph(x,y,char,{color,vx,vy,life,size,spin,gravity,alpha,delay})
  // A character with gravity + spin + fade — kill letter-explosions and shards.
  function glyph(x, y, char, o) {
    o = o || {};
    const p = allocP();
    p.kind = K_GLYPH;
    p.x = x; p.y = y;
    p.vx = rng(o.vx, CFG_LETTER.vx || [-190, 190]);
    p.vy = rng(o.vy, CFG_LETTER.vy || [-330, -60]);
    p.g = num(o.gravity, num(CFG_GLYPH.gravity, 760));
    p.drag = num(o.drag, 0.15);
    p.rot = num(o.rot, 0);
    p.spin = num(o.spin, U.rand(-1, 1) * num(CFG_GLYPH.spin, 8));
    p.delay = num(o.delay, 0);
    const life = rng(o.life, CFG_GLYPH.life || [0.5, 1.0]);
    p.t = 0; p.life = life > 0.01 ? life : 0.01; p.invLife = 1 / p.life;
    p.size = num(o.size, num(CFG_GLYPH.size, 18));
    p.a0 = num(o.alpha, 1);
    p.color = o.color || WHITE;
    p.ch = (char === undefined || char === null || char === '') ? U.pick(U.GLYPHS) : String(char);
    return p;
  }

  // converge(x,y,char,{color,life,size,dist,angle,x0,y0,spin,alpha,delay})
  // Glyph flying from an offset INTO (x,y) over its life on easeOutCubic —
  // enemy materialize (§11.5) and the title-logo assembly.
  function converge(x, y, char, o) {
    o = o || {};
    const p = allocP();
    const dist = num(o.dist, num(CFG_CONV.jitter, 120));
    const ang = num(o.angle, Math.random() * TAU);
    p.kind = K_CONVERGE;
    p.x0 = num(o.x0, x + Math.cos(ang) * dist);
    p.y0 = num(o.y0, y + Math.sin(ang) * dist);
    p.x1 = x; p.y1 = y;
    p.x = p.x0; p.y = p.y0;
    p.vx = 0; p.vy = 0; p.g = 0; p.drag = 0;
    p.spin = num(o.spin, U.rand(-1, 1) * 2.2);
    p.rot = p.spin;
    p.delay = num(o.delay, 0);
    const life = rng(o.life, num(CFG_CONV.life, 0.25));
    p.t = 0; p.life = life > 0.01 ? life : 0.01; p.invLife = 1 / p.life;
    p.size = num(o.size, num(CFG_CONV.size, 17));
    p.a0 = num(o.alpha, 1);
    p.color = o.color || WHITE;
    p.ch = (char === undefined || char === null || char === '') ? U.pick(U.GLYPHS) : String(char);
    return p;
  }

  // afterimage(x,y,text,{color,size,life,alpha,rot,vx,vy}) — fading ghost of
  // text: flow-state turret trails, banner motion blur (§11.5).
  function afterimage(x, y, text, o) {
    o = o || {};
    const p = allocP();
    p.kind = K_AFTER;
    p.x = x; p.y = y;
    p.vx = num(o.vx, 0); p.vy = num(o.vy, 0);
    p.g = num(o.gravity, 0); p.drag = 0;
    p.rot = num(o.rot, 0); p.spin = num(o.spin, 0);
    p.delay = num(o.delay, 0);
    const life = rng(o.life, num(CFG_AFTER.life, 0.24));
    p.t = 0; p.life = life > 0.01 ? life : 0.01; p.invLife = 1 / p.life;
    p.size = num(o.size, 22);
    p.a0 = num(o.alpha, num(CFG_AFTER.alpha, 0.42));
    p.color = o.color || WHITE;
    p.ch = (text === undefined || text === null) ? '' : String(text);
    return p;
  }

  // shard(x,y,{color,count,size,life,text,spin,gravity}) — the combo counter
  // physically cracking: 2–3 chunks of `text` dropping with gravity (§11.5).
  function shard(x, y, o) {
    o = o || {};
    const n = Math.max(1, rngInt(o.count, num(TC.breakShards, 3)));
    const txt = (o.text === undefined || o.text === null) ? '' : String(o.text);
    const life = rng(o.life, num(TC.breakShardLife, num(CFG_SHARD.life, 1.0)));
    const g = num(o.gravity, num(TC.breakShardGravity, num(CFG_SHARD.gravity, 900)));
    const size = num(o.size, num(CFG_SHARD.size, 22));
    const chunk = txt.length ? Math.max(1, Math.ceil(txt.length / n)) : 0;
    for (let i = 0; i < n; i++) {
      const piece = chunk ? txt.substr(i * chunk, chunk) : U.pick(U.GLYPHS);
      const spanX = (n > 1) ? (i / (n - 1) - 0.5) * 2 : 0;
      glyph(x + spanX * size * 0.6, y, (piece === '' ? U.pick(U.GLYPHS) : piece), {
        color: o.color || WHITE,
        vx: spanX * U.rand(60, 190) + U.rand(-30, 30),
        vy: U.rand(-260, -110),
        life: life, size: size, gravity: g,
        spin: U.rand(-1, 1) * num(CFG_SHARD.spin, 5),
        alpha: num(o.alpha, 1)
      });
    }
  }

  // beam(x0,y0,x1,y1,{color,life,width,bloom}) — laser tracer: bright core plus
  // faked additive bloom (3 layered strokes, no shadowBlur / no filter).
  function beam(x0, y0, x1, y1, o) {
    o = o || {};
    const p = allocB();
    p.x0 = x0; p.y0 = y0; p.x1 = x1; p.y1 = y1;
    const life = rng(o.life, num(CFG_BEAM.life, 0.03));
    p.t = 0; p.life = life > 0.005 ? life : 0.005; p.invLife = 1 / p.life;
    p.width = num(o.width, num(CFG_BEAM.width, 2.5));
    p.bloom = num(o.bloom, num(CFG_BEAM.bloom, 9));
    p.a0 = num(o.alpha, 1);
    p.color = o.color || WHITE;
    return p;
  }

  // popup(x,y,text,{color,size,life,vy,scalePop,alpha}) — floating score text:
  // rises on ease-out, scale-pops 1.0->1.4->1.0 over 120ms, then fades.
  function popup(x, y, text, o) {
    o = o || {};
    const p = allocU();
    p.x = x; p.y = y;
    const life = rng(o.life, num(CFG_POPUP.life, num(TS.popupLife, 0.85)));
    p.t = 0; p.life = life > 0.02 ? life : 0.02; p.invLife = 1 / p.life;
    p.vy = num(o.vy, num(CFG_POPUP.vy, num(TS.popupVy, -46)));
    p.size = num(o.size, num(CFG_POPUP.size, num(TS.popupSize, 20)));
    p.pop = num(o.scalePop, num(TS.popupScalePop, 1.35));
    p.a0 = num(o.alpha, 1);
    p.color = o.color || WHITE;
    p.text = (text === undefined || text === null) ? '' : String(text);
    return p;
  }

  // ring(x,y,{color,r0,r1,life,width,displace,strength,alpha}) — expanding
  // shockwave with width falloff. displace:true also registers a live record in
  // PI.FX.displacements for the background's radial warp; retired on death.
  function ring(x, y, o) {
    o = o || {};
    const p = allocR();
    p.x = x; p.y = y;
    p.r0 = num(o.r0, num(CFG_RING.r0, 6));
    p.r1 = num(o.r1, num(CFG_RING.r1, 74));
    p.r = p.r0;
    const life = rng(o.life, num(CFG_RING.life, 0.42));
    p.t = 0; p.life = life > 0.02 ? life : 0.02; p.invLife = 1 / p.life;
    p.width = num(o.width, num(CFG_RING.width, 3));
    p.a0 = num(o.alpha, 1);
    p.color = o.color || WHITE;
    p.strength = num(o.strength, num((TB.death && TB.death.displaceStrength), 40));
    if (o.displace && dispFree.length) {
      const d = dispFree.pop();
      d.x = x; d.y = y; d.r = p.r0; d.strength = p.strength;
      p.disp = d;
      displacements.push(d);
    }
    return p;
  }

  // stress(n): perf harness — n cheap sparks with random velocities.
  function stress(n) {
    const c = Math.max(0, n | 0);
    for (let i = 0; i < c; i++) {
      const p = allocP();
      const ang = Math.random() * TAU, sp = U.rand(40, 320);
      p.kind = K_SPARK;
      p.x = U.rand(40, VIEW.W - 40); p.y = U.rand(40, VIEW.H - 60);
      p.vx = Math.cos(ang) * sp; p.vy = Math.sin(ang) * sp;
      p.g = 90; p.drag = 1.2; p.rot = 0; p.spin = 0; p.delay = 0;
      const life = rng(T.stressLife, [0.4, 1.2]);
      p.t = 0; p.life = life > 0.01 ? life : 0.01; p.invLife = 1 / p.life;
      p.size = 2.4; p.a0 = 0.9; p.color = WHITE; p.ch = '';
    }
  }

  // ---------------------------------------------------------------- update
  function update(dt) {
    if (!(dt > 0)) dt = 0;

    let i = 0;
    while (i < pLive) {
      const p = parts[i];
      if (p.delay > 0) { p.delay -= dt; i++; continue; }
      p.t += dt;
      if (p.t >= p.life) { pLive = swapOut(parts, i, pLive); continue; }
      if (p.kind === K_CONVERGE) {
        const e = U.easeOutCubic(p.t * p.invLife);
        p.x = p.x0 + (p.x1 - p.x0) * e;
        p.y = p.y0 + (p.y1 - p.y0) * e;
        p.rot = p.spin * (1 - e);
      } else {
        p.vy += p.g * dt;
        if (p.drag !== 0) {
          let f = 1 - p.drag * dt;
          if (f < 0) f = 0;
          p.vx *= f; p.vy *= f;
        }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.spin !== 0) p.rot += p.spin * dt;
      }
      i++;
    }

    i = 0;
    while (i < bLive) {
      const b = beams[i];
      b.t += dt;
      if (b.t >= b.life) { bLive = swapOut(beams, i, bLive); continue; }
      i++;
    }

    i = 0;
    while (i < uLive) {
      const u = popups[i];
      u.t += dt;
      if (u.t >= u.life) { uLive = swapOut(popups, i, uLive); continue; }
      i++;
    }

    i = 0;
    while (i < rLive) {
      const r = rings[i];
      r.t += dt;
      if (r.t >= r.life) { releaseDisp(r); rLive = swapOut(rings, i, rLive); continue; }
      const pr = r.t * r.invLife;
      r.r = r.r0 + (r.r1 - r.r0) * U.easeOutCubic(pr);
      if (r.disp) {
        const d = r.disp;
        d.x = r.x; d.y = r.y; d.r = r.r;
        d.strength = r.strength * Math.pow(1 - pr, DISP_DECAY);
      }
      i++;
    }
  }

  // ---------------------------------------------------------------- drawing
  let lastFont = null, lastFill = null, lastStroke = null;
  const fontCache = [];
  function fontFor(px) {
    let s = px | 0;
    if (s < 1) s = 1; else if (s > 220) s = 220;
    let f = fontCache[s];
    if (f === undefined) { f = s + 'px ' + (PI.FONT || 'monospace'); fontCache[s] = f; }
    return f;
  }
  function setFont(ctx, f)   { if (f !== lastFont)   { ctx.font = f;         lastFont = f; } }
  function setFill(ctx, c)   { if (c !== lastFill)   { ctx.fillStyle = c;    lastFill = c; } }
  function setStroke(ctx, c) { if (c !== lastStroke) { ctx.strokeStyle = c;  lastStroke = c; } }

  function draw(ctx) {
    // Other modules own ctx state between frames — invalidate the caches.
    lastFont = null; lastFill = null; lastStroke = null;

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    // --- beams: widest / faintest layer first, bright core last ------------
    for (let i = 0; i < bLive; i++) {
      const b = beams[i];
      const a = b.a0 * (1 - b.t * b.invLife);
      if (a <= 0.002) continue;
      setStroke(ctx, b.color);
      const bw = b.bloom;
      ctx.globalAlpha = a * 0.10; ctx.lineWidth = b.width + bw;
      strokeSeg(ctx, b);
      ctx.globalAlpha = a * 0.24; ctx.lineWidth = b.width + bw * 0.45;
      strokeSeg(ctx, b);
      ctx.globalAlpha = a;        ctx.lineWidth = b.width;
      strokeSeg(ctx, b);
    }

    // --- rings: soft outer halo + core stroke, width falls off with age ----
    for (let i = 0; i < rLive; i++) {
      const r = rings[i];
      const pr = r.t * r.invLife;
      const a = r.a0 * (1 - pr) * (1 - pr * 0.35);
      if (a <= 0.002 || r.r <= 0.5) continue;
      const w = r.width * (1 - pr * 0.82);
      setStroke(ctx, r.color);
      ctx.globalAlpha = a * 0.28; ctx.lineWidth = Math.max(0.5, w * 3);
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
      ctx.globalAlpha = a;        ctx.lineWidth = Math.max(0.6, w);
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
    }

    // --- additive particles: sparks (dots) + trails (streaks) -------------
    for (let i = 0; i < pLive; i++) {
      const p = parts[i];
      if (p.kind > K_TRAIL || p.delay > 0) continue;
      const pr = p.t * p.invLife;
      const f = 1 - pr;
      const a = p.a0 * f;
      if (a <= 0.004) continue;
      if (p.kind === K_SPARK) {
        const s = p.size * (0.35 + 0.65 * f);
        setFill(ctx, p.color);
        ctx.globalAlpha = a;
        ctx.fillRect(p.x - s * 0.5, p.y - s * 0.5, s, s);
      } else {
        setStroke(ctx, p.color);
        ctx.globalAlpha = a;
        ctx.lineWidth = Math.max(0.5, p.size * f);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * p.trailLen, p.y - p.vy * p.trailLen);
        ctx.stroke();
      }
    }

    // --- normal-composite text: glyphs, converges, afterimages, popups -----
    ctx.globalCompositeOperation = 'source-over';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let i = 0; i < pLive; i++) {
      const p = parts[i];
      if (p.kind <= K_TRAIL || p.delay > 0) continue;
      const pr = p.t * p.invLife;
      let a = p.a0;
      if (p.kind === K_GLYPH) {
        const f = 1 - pr;
        a *= f < 0.45 ? f * 2.22 : 1;
      } else if (p.kind === K_CONVERGE) {
        const inA = pr * 6, outA = (1 - pr) * 4.5;
        a *= (inA < 1 ? inA : 1) * (outA < 1 ? outA : 1);
      } else { // afterimage: quadratic fade
        const f = 1 - pr;
        a *= f * f;
      }
      if (a <= 0.004 || p.ch === '') continue;
      setFont(ctx, fontFor(p.kind === K_CONVERGE ? p.size * (1.25 - 0.25 * pr) : p.size));
      setFill(ctx, p.color);
      ctx.globalAlpha = a;
      const rot = p.rot;
      if (rot > 0.008 || rot < -0.008) {
        ctx.translate(p.x, p.y);
        ctx.rotate(rot);
        ctx.fillText(p.ch, 0, 0);
        ctx.rotate(-rot);
        ctx.translate(-p.x, -p.y);
      } else {
        ctx.fillText(p.ch, p.x, p.y);
      }
    }

    for (let i = 0; i < uLive; i++) {
      const u = popups[i];
      const pr = u.t * u.invLife;
      // hold, then fade over the last 40% of life (ease-in so it lingers)
      let a = u.a0;
      if (pr > 0.6) a *= 1 - U.easeInCubic((pr - 0.6) / 0.4);
      if (a <= 0.004 || u.text === '') continue;
      // rise: velocity integrated through an ease-out so it decelerates
      const y = u.y + u.vy * u.life * U.easeOutCubic(pr);
      // 120ms scale-pop 1.0 -> pop -> 1.0 (sine gives a smooth there-and-back)
      const s = u.t < POP_TIME
        ? 1 + (u.pop - 1) * Math.sin(Math.PI * (u.t / POP_TIME))
        : 1;
      setFont(ctx, fontFor(u.size));
      ctx.globalAlpha = a;
      if (s !== 1) {
        // Core owns the outer camera transform, so the scale is applied and then
        // inverted in place (no save/restore, which would also drop our
        // fillStyle/font caches).
        ctx.translate(u.x, y);
        ctx.scale(s, s);
        setFill(ctx, INK);
        ctx.fillText(u.text, 1.5, 2);
        setFill(ctx, u.color);
        ctx.fillText(u.text, 0, 0);
        ctx.scale(1 / s, 1 / s);
        ctx.translate(-u.x, -y);
      } else {
        setFill(ctx, INK);
        ctx.fillText(u.text, u.x + 1.5, y + 2);
        setFill(ctx, u.color);
        ctx.fillText(u.text, u.x, y);
      }
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.lineCap = 'butt';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  function strokeSeg(ctx, b) {
    ctx.beginPath();
    ctx.moveTo(b.x0, b.y0);
    ctx.lineTo(b.x1, b.y1);
    ctx.stroke();
  }

  // ---------------------------------------------------------------- lifecycle
  function clear() {
    pLive = 0; bLive = 0; uLive = 0;
    for (let i = 0; i < rLive; i++) releaseDisp(rings[i]);
    rLive = 0;
    displacements.length = 0;
  }
  function count() { return pLive + bLive + uLive + rLive; }

  return {
    spark: spark, glyph: glyph, ring: ring, beam: beam, popup: popup,
    shard: shard, converge: converge, afterimage: afterimage, trail: trail,
    update: update, draw: draw, clear: clear, count: count,
    stress: stress,
    displacements: displacements,
    // introspection for the debug harness / tuning
    capacity: P_CAP,
    live: function () { return { parts: pLive, beams: bLive, popups: uLive, rings: rLive }; }
  };
})();

/* ==== 30-entities.js ==== */
// ============================================================================
// 30-entities.js — PI.Entities
// Enemies (DESIGN.md §6), the wave director (§8), the Prompt Injection boss (§7)
// and the system-command power-ups (§10). Every number is read from PI.TUNING;
// nothing is drawn here (50-render owns pixels), nothing scores here (40-typing
// owns score) — this module owns *what exists and where it is*.
// ============================================================================
PI.Entities = (function () {
  const U = PI.U, T = PI.TUNING, C = PI.C, FX = PI.FX, Core = PI.Core;
  const EN = T.enemy, EC = EN.common;
  const TW = T.wave, TB = T.boss, TCM = T.commands, TJ = T.juice;
  const W = T.view.W, H = T.view.H;
  const TAU = Math.PI * 2;

  // §6: an enemy "reaches the context window" when its capsule touches the leak
  // line. TUNING.player.leakLine (652) sits just above the context bar strip
  // (bar top = 664, H - barHeight = 680), so it is the authoritative line here.
  const LEAK_Y = num(T.player && T.player.leakLine, H - num(T.hud && T.hud.contextBar && T.hud.contextBar.h, 40));
  const TURRET_X = num(T.player && T.player.turretX, W * 0.5);
  const TURRET_Y = num(T.player && T.player.turretY, H - 86);

  // Hot-path tuning, resolved once (no per-frame property walks / no allocation).
  const HAL = EN.halluc, JL = EN.jail, OVF = EN.overflow, CMD = EN.command;
  const SPAWN_Y = num(EC.spawnY, -46);
  const MAT_T = Math.max(0.01, num(EC.materialize, 0.25));
  const DYING_T = Math.max(0.01, num(EC.dyingTime, 0.18));
  const WOBBLE = num(EC.wobbleAmpX, 5);
  const MARGIN_X = num(EC.spawnMarginX, 84);
  const HAL_AMP = num(HAL.amplitude, 60), HAL_PER = Math.max(0.1, num(HAL.period, 3));
  const HAL_OP = num(HAL.opacity, 0.55), HAL_FD = num(HAL.flickerDepth, 0.18);
  const HAL_FHZ = num(HAL.flickerHz, 9), HAL_JIT = num(HAL.jitter, 1);
  const JL_IV = num(JL.dashInterval, 2.5), JL_DIST = num(JL.dashDist, 120);
  const JL_TIME = Math.max(0.02, num(JL.dashTime, 0.2)), JL_ANG = num(JL.dashAngle, 0.7);
  const JL_STREAK = Math.max(0.05, num(JL.streakLife, 0.32));
  const OVF_GAIN = num(OVF.pulseGain, 0.32), OVF_DEPTH = num(OVF.pulseByDepth, 0.45);
  const OVF_PER = Math.max(0.1, num(OVF.pulsePeriod, 1.7));
  const CMD_PER = Math.max(0.1, num(CMD.pulsePeriod, 0.9)), CMD_GAIN = num(CMD.pulseGain, 0.16);
  const CMD_SPARK_IV = num(CMD.sparkleInterval, 0.1), CMD_SPARK_N = num(CMD.sparkleCount, 2);
  const CMD_DESPAWN = num(CMD.despawnBelow, 700);
  const DEPTH_SPAN = Math.max(1, LEAK_Y - SPAWN_Y);

  // ------------------------------------------------------------------ state
  const list = [];                 // stable array reference (debug hook maps it)
  let nextId = 1;
  let wave = 0, pendingWave = 1;
  let bossTier = 0, boss = null, bossesDefeated = 0;
  // director phases: idle | spawning | clearing | breather | bossintro | boss | bossdeath
  let phase = 'idle', phaseT = 0;
  let budget = 0, spawnedCount = 0, spawnTimer = 0;
  let bannerShownFor = -1, idleGrace = 0;
  let freezeT = 0;
  const purgeQueue = [];
  let purgeTimer = 0;
  let commandOnScreen = null, cmdTimer = 0, commandFiredAt = -99;

  // ------------------------------------------------------------------ helpers
  function num(v, d) { return (typeof v === 'number' && isFinite(v)) ? v : d; }
  function cfgOf(type) { return EN[type] || EN.token; }
  function snd(fn, a, b) {
    const A = PI.Audio;
    if (A && typeof A[fn] === 'function') { try { A[fn](a, b); } catch (_) { } }
  }
  function banner(text, opts) {
    const R = PI.Render;
    if (R && typeof R.showBanner === 'function') { try { R.showBanner(text, opts); } catch (_) { } }
  }
  function integrity() {
    const g = PI.Game;
    const v = g ? g.integrity : 100;
    return (typeof v === 'number' && isFinite(v)) ? v : 100;
  }
  // Kill through PI.Game so score / fx / audio stay in one place; fall back to a
  // bare removal if Game is not wired yet (unit-style harness runs).
  function killVia(e) {
    const g = PI.Game;
    if (g && typeof g.killEnemy === 'function') { g.killEnemy(e); if (list.indexOf(e) >= 0) remove(e); return; }
    FX.spark(e.x, e.y, { color: e.color, count: 14 });
    remove(e);
  }
  function nextChar(e) {
    if (!e || typeof e.word !== 'string') return '';
    return (e.typed < e.word.length) ? e.word.charAt(e.typed) : '';
  }

  // ------------------------------------------------------------------ measuring
  // No ctx exists until Core.boot(), so widths start as a 0.6*fontSize estimate
  // and are re-measured (once, cached) as soon as a real 2d context shows up.
  const measCache = new Map();
  let lastMeasureExact = false;
  function textWidth(word, fs) {
    const key = fs + '|' + word;
    const hit = measCache.get(key);
    if (hit !== undefined) { lastMeasureExact = true; return hit; }
    const c = Core && Core.ctx;
    if (c && typeof c.measureText === 'function') {
      let v = 0;
      try {
        const prev = c.font;
        c.font = fs + 'px ' + (PI.FONT || 'monospace');
        v = c.measureText(word).width;
        c.font = prev;
      } catch (_) { v = 0; }
      if (v > 0) {
        if (measCache.size > 512) measCache.clear();
        measCache.set(key, v);
        lastMeasureExact = true;
        return v;
      }
    }
    lastMeasureExact = false;
    return word.length * fs * 0.6;
  }
  function sizeEnemy(e) {
    const pad = EC.capsulePadX * (e.fontSize / EC.fontSize);
    e.textW = textWidth(e.word, e.fontSize);
    e.charW = e.word.length ? e.textW / e.word.length : e.fontSize * 0.6;
    e.w = e.textW + pad * 2;
    e.h = e.fontSize + EC.capsulePadY * 2;
    e.measured = lastMeasureExact;
  }
  // Render may call this on first draw with its own ctx (contract note) — the
  // update loop already re-measures lazily, so this is just belt and braces.
  function measureEnemy(e, ctx) {
    if (!e) return e;
    if (ctx && typeof ctx.measureText === 'function' && !e.measured) {
      try {
        const prev = ctx.font;
        ctx.font = e.fontSize + 'px ' + (PI.FONT || 'monospace');
        const v = ctx.measureText(e.word).width;
        ctx.font = prev;
        if (v > 0) {
          const key = e.fontSize + '|' + e.word;
          if (measCache.size > 512) measCache.clear();
          measCache.set(key, v);
        }
      } catch (_) { }
    }
    if (!e.measured) { sizeEnemy(e); if (e.kind !== 'bossword') clampX(e); }
    return e;
  }
  // Centre of letter i — used for laser tracers and per-letter particles.
  function letterPos(e, i, out) {
    const o = out || { x: 0, y: 0 };
    const n = e.word.length || 1;
    const cw = (e.charW || e.fontSize * 0.6) * (e.scale || 1);
    o.x = e.x - (n * cw) * 0.5 + cw * (i + 0.5);
    o.y = e.y;
    return o;
  }

  // ------------------------------------------------------------------ placement
  function wordOnScreen(word, pending) {
    for (let i = 0; i < list.length; i++) if (list[i].word === word) return true;
    if (pending) for (let i = 0; i < pending.length; i++) if (pending[i] === word) return true;
    return false;
  }
  // §5/§6: two live enemies expecting the same next character make lock-on
  // ambiguous, so the spawner avoids it when it can.
  function firstLetterClash(word, pending) {
    const ch = word.charAt(0);
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (!e.alive || e.dying) continue;
      if (nextChar(e) === ch) return true;
    }
    if (pending) for (let i = 0; i < pending.length; i++) if (pending[i].charAt(0) === ch) return true;
    return false;
  }
  function chooseWord(type, pending) {
    const pool = (PI.WORDS && PI.WORDS[type]) || null;
    if (!pool || !pool.length) return type + '' + nextId;
    const rerolls = Math.max(0, num(EN.firstLetterRerolls, 5));
    let fallback = null;
    for (let i = 0; i <= rerolls; i++) {
      const w = U.pick(pool);
      if (EN.noDupWords !== false && wordOnScreen(w, pending)) continue;
      if (fallback === null) fallback = w;
      if (!firstLetterClash(w, pending)) return w;      // clean pick
    }
    if (fallback !== null) return fallback;             // rerolls exhausted: allow clash
    for (let i = 0; i < pool.length; i++) {             // last resort: any non-duplicate
      if (!wordOnScreen(pool[i], pending)) return pool[i];
    }
    return U.pick(pool);
  }

  // 6 candidate x positions, keep the whole word on screen, avoid overlapping the
  // rect of anything already near that spawn band.
  function clearance(x, halfW, y, h) {
    let worst = 1e9;
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (!e.alive) continue;
      const eh = (e.h * (e.scale || 1)) * 0.5 + h * 0.5 + 10;
      if (Math.abs(e.y - y) > eh) continue;             // no vertical overlap
      const gap = Math.abs(e.x - x) - (halfW + e.w * (e.scale || 1) * 0.5 + 14);
      if (gap < worst) worst = gap;
    }
    return worst;
  }
  function placeX(width, y, h, extra) {
    const half = width * 0.5 + num(extra, 0);
    const margin = MARGIN_X;
    let lo = Math.max(margin, half + 6);
    let hi = Math.min(W - margin, W - half - 6);
    if (hi <= lo) { lo = hi = W * 0.5; }
    let best = U.rand(lo, hi), bestScore = -1e9;
    for (let i = 0; i < 6; i++) {
      const x = (i === 0) ? best : U.rand(lo, hi);
      const s = clearance(x, width * 0.5, y, h);
      if (s > 0) return x;                              // clean slot
      if (s > bestScore) { bestScore = s; best = x; }
    }
    return best;
  }
  function clampX(e) {
    const half = e.w * (e.scale || 1) * 0.5 + (e.type === 'halluc' ? HAL_AMP : 0);
    const lo = Math.max(6, half + 4), hi = Math.min(W - 6, W - half - 4);
    if (hi <= lo) { e.baseX = W * 0.5; }
    else e.baseX = U.clamp(e.baseX, lo, hi);
    e.x = e.baseX;
  }

  // ------------------------------------------------------------------ factory
  function makeEnemy(type, word) {
    const cfg = cfgOf(type);
    const kind = (type === 'command') ? 'command' : (type === 'bossword' ? 'bossword' : 'enemy');
    const e = {
      // ---- contract fields -------------------------------------------------
      id: nextId++, kind: kind, type: type,
      word: word, typed: 0,
      x: W * 0.5, y: SPAWN_Y, vy: 0,
      w: 0, h: 0,
      color: C.forType(type),
      alive: true, dying: false,
      damage: num(cfg.damage, 0),
      scale: num(cfg.scale, 1), alpha: 1,
      spawnT: 0,
      effect: null, boss: null, index: -1,
      // ---- shared internals (one monomorphic shape for every type) ---------
      fontSize: num(cfg.fontSize, EC.fontSize),
      baseScale: num(cfg.scale, 1),
      baseSpeed: num(cfg.speed, 30),
      speedMul: 1,
      baseX: W * 0.5, textW: 0, charW: 0, measured: false,
      ageT: 0, dieT: 0, leaked: false, snapped: false,
      wobblePhase: U.rand(0, TAU),
      wobbleFreq: U.rand(num(EC.wobbleFreqMin, 0.35), num(EC.wobbleFreqMax, 0.85)),
      jitter: false, jitterPx: 0,                 // halluc: renderer letter jitter
      sinePhase: U.rand(0, TAU), sineAmp: 0,      // halluc drift
      dashT: 0, dashTimer: 0, dashing: false, dashProg: 0, dashPrev: 0,
      dashDX: 0, dashDY: 0, dashDir: (Math.random() < 0.5 ? -1 : 1),
      dashX0: 0, dashY0: 0, dashCount: 0,
      pulse: 0, sparkT: 0,
      popIndex: -1, popT: 99, typedSeen: 0,       // per-letter consume pop (§11)
      shakeT: 0,                                  // Game.typo(e) may set this
      targetable: false, tutorial: false,
      effectFired: false, deathHandled: false, offsetX: 0
    };
    sizeEnemy(e);
    if (type === 'halluc') { e.jitter = true; e.sineAmp = HAL_AMP; }
    return e;
  }

  // §11.5: enemies materialize — 6–10 stray glyphs converge into the word.
  function materialize(e) {
    e.spawnT = 0;
    const g = EC.materializeGlyphs || [6, 10];
    const n = U.randInt(num(g[0], 6), num(g[1], 10));
    const life = MAT_T;
    const half = e.w * 0.5;
    for (let i = 0; i < n; i++) {
      FX.converge(e.x + U.rand(-half, half), e.y + U.rand(-e.h * 0.4, e.h * 0.4),
        U.pick(U.GLYPHS), {
          color: e.color, life: life * U.rand(0.8, 1.0),
          size: e.fontSize * 0.85, dist: U.rand(70, 160), alpha: 0.9
        });
    }
  }

  // ------------------------------------------------------------------ spawning
  function currentSpeedMul() {
    const s = TW.speedMul || {};
    return Math.min(num(s.cap, 2.2), num(s.base, 1) + num(s.per, 0.045) * (Math.max(1, wave) - 1));
  }
  function currentInterval() {
    const si = TW.spawnInterval || {};
    let iv = Math.max(num(si.floor, 0.55), num(si.base, 2.2) * Math.pow(num(si.decay, 0.93), Math.max(1, wave)));
    const m = TW.mercy || {};
    // §8 intensity valve: under 30% integrity the effective spawn rate drops 25%.
    if (integrity() < num(m.below, 30)) iv = iv / Math.max(0.1, 1 - num(m.reduce, 0.25));
    return iv;
  }
  function unlockedTypes() {
    const roster = TW.roster || ['token'];
    const out = [];
    for (let i = 0; i < roster.length; i++) {
      const t = roster[i];
      if (!PI.WORDS[t] || !PI.WORDS[t].length) continue;
      if (wave >= num(cfgOf(t).firstWave, 1)) out.push(t);
    }
    if (!out.length) out.push('token');
    return out;
  }
  function pickType() {
    const types = unlockedTypes();
    const t = U.weightedPick(types, function (n2) { return num(cfgOf(n2).weight, 1); });
    return t || 'token';
  }

  function spawnEnemy(type, o) {
    o = o || {};
    const cfg = cfgOf(type);
    const word = o.word || chooseWord(type, o.pending);
    const e = makeEnemy(type, word);
    e.baseSpeed = num(o.speed, num(cfg.speed, 30));
    e.speedMul = num(o.speedMul, currentSpeedMul());
    e.y = num(o.y, SPAWN_Y);
    const extra = (type === 'halluc') ? HAL_AMP : 0;
    e.baseX = (o.x !== undefined && o.x !== null) ? o.x : placeX(e.w, e.y, e.h, extra);
    clampX(e);
    list.push(e);
    materialize(e);
    return e;
  }

  // §6 Token Swarm: a cluster of 3 tiny words within 150px of each other.
  function spawnSwarm() {
    const cfg = EN.swarm;
    const n = Math.max(1, num(cfg.count, 3));
    const spread = num(cfg.spread, 150), spreadY = num(cfg.spreadY, 90);
    const pending = [];
    const cx = U.rand(MARGIN_X + spread * 0.5, W - MARGIN_X - spread * 0.5);
    let first = null;
    for (let i = 0; i < n; i++) {
      const word = chooseWord('swarm', pending);
      pending.push(word);
      // span + jitter stays inside `spread` so the cluster is truly within 150px
      const off = (n > 1) ? (i / (n - 1) - 0.5) * (spread - 24) : 0;
      const e = spawnEnemy('swarm', {
        word: word,
        x: cx + off + U.rand(-12, 12),
        y: SPAWN_Y - U.rand(0, spreadY),
        pending: pending
      });
      if (!first) first = e;
    }
    return first;
  }

  function spawnFromRoster() {
    const type = pickType();
    if (type === 'swarm') return spawnSwarm();
    return spawnEnemy(type);
  }

  // Public force-spawn (debug hook / harassment / Game).
  function spawn(type) {
    let t = (typeof type === 'string' && type) ? type.toLowerCase() : 'token';
    if (t === 'command' || t === 'cmd') return spawnCommand(true);
    if (t === 'boss') { startWave(nextBossWave()); return boss; }
    if (t === 'swarm') return spawnSwarm();
    if (!EN[t] || !PI.WORDS[t] || !PI.WORDS[t].length) t = 'token';
    return spawnEnemy(t);
  }

  function spawnTutorial() {
    const tut = TW.tutorial || {};
    const e = spawnEnemy(tut.type || 'token', {
      word: tut.word || 'start',
      x: num(tut.x, W * 0.5), y: num(tut.y, 40),
      speed: num(tut.speed, 13), speedMul: 1
    });
    e.tutorial = true;
    e.damage = 0;
    return e;
  }

  function nextBossWave() {
    const every = Math.max(1, num(TW.bossEvery, 5));
    return (Math.floor(Math.max(0, wave) / every) + 1) * every;
  }

  // ------------------------------------------------------------------ commands
  function commandFirstLetterFree(word) {
    const ch = word.charAt(0);
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (!e.alive || e.dying) continue;
      if (nextChar(e) === ch) return false;
    }
    return true;
  }
  // §10: golden word, 20 px/s, unique first letter where possible.
  function spawnCommand(force) {
    if (commandOnScreen && !force) return null;
    if (commandOnScreen && force) { remove(commandOnScreen); }
    const defs = PI.COMMANDS || [];
    if (!defs.length) return null;
    let def = null;
    const weights = TCM.weights || {};
    for (let i = 0; i < 5; i++) {
      const cand = U.weightedPick(defs, function (d) { return num(weights[d.effect], num(d.weight, 1)); });
      if (!cand) break;
      if (def === null) def = cand;
      if (TCM.uniqueFirstLetter === false || commandFirstLetterFree(cand.word)) { def = cand; break; }
    }
    if (!def) def = defs[0];
    const e = makeEnemy('command', def.word);
    e.effect = def.effect;
    e.baseSpeed = num(EN.command.speed, 20);
    e.speedMul = 1;
    e.damage = 0;
    e.y = SPAWN_Y;
    e.baseX = placeX(e.w, e.y, e.h, 0);
    clampX(e);
    list.push(e);
    materialize(e);
    commandOnScreen = e;
    cmdTimer = commandDelay();
    snd('command');
    return e;
  }
  function commandDelay() {
    return Math.max(3, num(TCM.interval, 25) + U.rand(-num(TCM.jitter, 5), num(TCM.jitter, 5)));
  }

  // temp=0 — all enemies halt for 4s.
  function freeze(seconds) {
    commandFiredAt = U.now();
    const d = (typeof seconds === 'number' && seconds > 0) ? seconds : num(TCM.freeze.duration, 4);
    freezeT = Math.max(freezeT, d);
    snd('freeze');
    if (Core.addTrauma) Core.addTrauma(num(TJ.trauma.freeze, 0.18));
    // frost crystals over the frozen enemies
    let bud = Math.max(0, num(TCM.freeze.crystals, 26));
    const tint = TCM.freeze.tint || C.cyan;
    for (let i = 0; i < list.length && bud > 0; i++) {
      const e = list[i];
      if (!e.alive || e.kind === 'command') continue;
      const n = Math.min(bud, 6);
      bud -= n;
      FX.spark(e.x, e.y, { color: tint, count: n, speed: [20, 110], life: [0.35, 0.8], size: 2.2, drag: 5 });
    }
    if (bud > 0) FX.spark(W * 0.5, H * 0.4, { color: tint, count: bud, speed: [40, 220], life: [0.4, 0.9], size: 2 });
    return freezeT;
  }

  // rlhf — destroy every non-boss enemy, 60ms apart (popcorn cascade).
  function purge() {
    commandFiredAt = U.now();
    purgeQueue.length = 0;
    const skipBoss = TCM.purge.skipBoss !== false;
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (!e.alive || e.dying) continue;
      if (e.kind === 'command') continue;
      if (e.kind === 'bossword' && skipBoss) continue;
      purgeQueue.push(e);
    }
    // lowest (most dangerous) first
    purgeQueue.sort(function (a, b) { return b.y - a.y; });
    purgeTimer = 0;
    snd('purge');
    if (Core.addTrauma) Core.addTrauma(num(TJ.trauma.purge, 0.24));
    FX.ring(W * 0.5, H * 0.55, {
      color: C.gold, r0: 20, r1: 620, life: 0.7, width: 6, displace: true, strength: 22
    });
    return purgeQueue.length;
  }
  function updatePurge(udt) {
    if (!purgeQueue.length) return;
    purgeTimer -= udt;
    const stagger = Math.max(0.01, num(TCM.purge.stagger, 0.06));
    let guard = 64;
    while (purgeQueue.length && purgeTimer <= 0 && guard-- > 0) {
      const e = purgeQueue.shift();
      purgeTimer += stagger;
      if (!e.alive || e.dying || list.indexOf(e) < 0) continue;
      if (Core.addTrauma) Core.addTrauma(num(TCM.purge.traumaEach, 0.09));
      killVia(e);
    }
  }

  // stop — destroy the enemy nearest the bottom.
  function stopSeq() {
    commandFiredAt = U.now();
    snd('stopSeq');
    let best = null;
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (!e.alive || e.dying || e.kind !== 'enemy') continue;
      if (e.spawnT < 0.2) continue;
      if (!best || e.y > best.y) best = e;
    }
    if (!best) {
      FX.spark(TURRET_X, TURRET_Y, { color: C.gold, count: 10, speed: [80, 220], life: [0.2, 0.4] });
      return null;
    }
    FX.beam(TURRET_X, TURRET_Y, best.x, best.y, {
      color: C.gold, life: num(TCM.stopseq.beamLife, 0.22), width: 4.5, bloom: 16
    });
    if (Core.addTrauma) Core.addTrauma(num(TJ.trauma.command, 0.16));
    killVia(best);
    return best;
  }

  // Dispatcher — PI.Game.killEnemy(command) should call this (or the individual
  // effect); remove() also auto-fires it as a safety net (see remove()).
  function applyCommand(effect, e) {
    if (e) e.effectFired = true;
    switch (effect) {
      case 'freeze': freeze(); break;
      case 'purge': purge(); break;
      case 'stopseq': stopSeq(); break;
      default: return false;
    }
    return true;
  }

  // ------------------------------------------------------------------ boss (§7)
  function bossFontSize(words) {
    const cfg = EN.bossword;
    const base = num(cfg.fontSize, 30);
    const maxW = W - 96;
    for (let fs = base; fs >= 14; fs--) {
      const k = fs / base;
      const gap = num(cfg.gap, 22) * k;
      const pad = EC.capsulePadX * (fs / EC.fontSize) * 2;
      let total = gap * (words.length - 1);
      for (let i = 0; i < words.length; i++) total += textWidth(words[i], fs) + pad;
      if (total <= maxW) return fs;
    }
    return 14;
  }
  function layoutBoss(b, words) {
    const cfg = EN.bossword;
    const fs = b.fontSize;
    const k = fs / num(cfg.fontSize, 30);
    const gap = num(cfg.gap, 22) * k;
    let total = gap * (words.length - 1);
    const ws = [];
    for (let i = 0; i < words.length; i++) {
      const e = makeEnemy('bossword', words[i]);
      e.fontSize = fs;
      sizeEnemy(e);
      e.boss = b; e.index = i;
      e.damage = 0;
      e.baseSpeed = 0; e.speedMul = 0;
      ws.push(e);
      total += e.w;
    }
    let cx = -total * 0.5;
    for (let i = 0; i < ws.length; i++) {
      const e = ws[i];
      e.offsetX = cx + e.w * 0.5;
      cx += e.w + gap;
      e.baseX = b.x + e.offsetX;
      e.x = e.baseX;
      e.y = b.y;
      b.words.push(e);
      list.push(e);
      materialize(e);
    }
    b.w = total; b.h = ws.length ? ws[0].h : 40;
  }

  function beginBoss(w) {
    bossTier = Math.max(1, Math.round(w / Math.max(1, num(TW.bossEvery, 5))));
    const pools = PI.BOSS_PHRASES || [[]];
    const tierIdx = Math.min(pools.length, Math.max(1, bossTier)) - 1;
    const pool = pools[tierIdx] && pools[tierIdx].length ? pools[tierIdx] : pools[0];
    const phrase = U.pick(pool) || 'ignore all previous instructions';
    const words = String(phrase).split(' ');
    const clean = [];
    for (let i = 0; i < words.length; i++) if (words[i].length) clean.push(words[i]);

    boss = {
      // ---- contract fields ------------------------------------------------
      phrase: phrase, words: [], x: W * 0.5, y: num(TB.entryY, -70),
      tier: bossTier, alive: true, wordIndex: 0,
      // ---- generic enemy-ish fields so PI.Game.leak(boss) just works -------
      id: nextId++, kind: 'boss', type: 'boss', word: phrase, typed: 0,
      damage: num(TB.damage, 50), color: C.forType('boss'),
      scale: 1, alpha: 1, spawnT: 1, dying: false, w: 0, h: 0, vy: 0,
      // ---- internals -------------------------------------------------------
      fontSize: 30, targetY: num(TB.entryY, -70),
      ySpring: { v: num(TB.entryY, -70), vel: 0 },
      introT: 0, introDur: num(TB.intro && TB.intro.duration, 1.2),
      harassT: num(TB.harassInterval, 6) * 0.6,
      deathT: 0, leaked: false, recoilCount: 0
    };
    boss.fontSize = bossFontSize(clean);
    layoutBoss(boss, clean);

    phase = 'bossintro';
    phaseT = 0;
    // §11.5 intro choreography (the *drawing* of the alert sweep is 50-render's)
    const intro = TB.intro || {};
    if (Core.setTimeScale) Core.setTimeScale(num(intro.timeScale, 0.3), num(intro.duration, 1.2));
    if (Core.punch) Core.punch(num(intro.zoom, 0.08), num(intro.duration, 1.2) * 0.5);
    if (Core.addTrauma) Core.addTrauma(num(TJ.trauma.bossIntro, 0.3));
    banner(TB.bannerText || '⚠ INCOMING PROMPT INJECTION',
      { style: 'alert', color: C.red, hold: num(TJ.bannerHold, 1) * 1.2 });
    snd('bossHit');
    if (PI.Audio && typeof PI.Audio.klaxon === 'function') snd('klaxon');
    return boss;
  }

  function spawnHarass() {
    const t = TB.harassType || 'token';
    if (!PI.WORDS[t] || !PI.WORDS[t].length) return null;
    return spawnEnemy(t);
  }

  function targetableBossWord() {
    if (!boss || !boss.alive || boss.dying) return null;
    if (phase === 'bossintro') return null;             // intro is not playable
    for (let i = 0; i < boss.words.length; i++) {
      const e = boss.words[i];
      if (e.alive && !e.dying && e.spawnT > 0.35) return e;
    }
    return null;
  }

  // Left-to-right kill order + 40px elastic recoil (§7 / §11.5).
  function handleBossWordDeath(e) {
    if (!e || e.deathHandled) return;
    e.deathHandled = true;
    e.alive = false;
    if (list.indexOf(e) >= 0) remove(e);                 // re-entry is guarded above
    const b = e.boss;
    if (!b || b !== boss || b.dying) return;
    b.targetY -= num(TB.knockback, 40);
    b.ySpring.vel -= 90;                                // kick for a snappier launch
    b.recoilCount++;
    let idx = b.words.length;
    for (let i = 0; i < b.words.length; i++) { if (b.words[i].alive) { idx = i; break; } }
    b.wordIndex = idx;
    if (idx >= b.words.length) beginBossDeath(b);
  }
  // PI.Game may call this explicitly from killEnemy; it is idempotent.
  function bossWordKilled(e) { handleBossWordDeath(e); return !!(boss && boss.dying); }

  function beginBossDeath(b) {
    if (!b || b.dying) return;
    b.dying = true;
    b.alive = false;
    b.deathT = 0;
    b.wordIndex = b.words.length;
    bossesDefeated++;
    phase = 'bossdeath';
    const d = TB.death || {};
    // §11.5 death: white flash -> background-bending shockwave -> letter rain.
    if (Core.flash) Core.flash(num(d.flashAlpha, 1), 0.14, '#ffffff');
    if (Core.addTrauma) Core.addTrauma(num(TJ.trauma.bossDeath, 1));
    if (Core.setTimeScale) Core.setTimeScale(num(d.slowmo, 0.28), num(TB.celebrateSlowmo, 1.5));
    if (Core.punch) Core.punch(num(TJ.punch, 0.08) * 1.5, 0.5);
    FX.ring(b.x, b.y, {
      color: C.white, r0: num(d.ringR0, 30), r1: num(d.ringR1, 1500),
      life: num(d.ringLife, 1.1), width: num(d.ringWidth, 26),
      displace: true, strength: num(d.displaceStrength, 46)
    });
    // slow-mo letter rain of the whole phrase
    for (let i = 0; i < b.words.length; i++) {
      const e = b.words[i];
      const n = e.word.length;
      const cw = e.charW || e.fontSize * 0.6;
      for (let j = 0; j < n; j++) {
        FX.glyph(e.x - (n * cw) * 0.5 + cw * (j + 0.5), e.y, e.word.charAt(j), {
          color: (j % 3 === 0) ? C.white : C.red,
          vx: U.rand(-120, 120), vy: U.rand(-260, -40),
          life: num(d.letterRainLife, 1.8) * U.rand(0.7, 1),
          size: e.fontSize, gravity: num(d.letterRainGravity, 240),
          spin: U.rand(-4, 4), delay: j * 0.02
        });
      }
    }
    snd('bossDie');
  }

  function clearBossWords(b) {
    if (!b) return;
    for (let i = 0; i < b.words.length; i++) {
      const e = b.words[i];
      e.deathHandled = true;
      if (list.indexOf(e) >= 0) remove(e);
    }
    b.words.length = 0;
  }
  function hardClearBoss() {
    if (!boss) return;
    clearBossWords(boss);
    boss.alive = false;
    boss = null;
  }

  function bossLeak(b, state) {
    if (b.leaked) return;
    b.leaked = true;
    const g = PI.Game;
    if (state === 'PLAYING' && g && typeof g.leak === 'function') g.leak(b);
    clearBossWords(b);
    b.alive = false;
    boss = null;
    beginBreather(wave + 1);
  }

  function updateBoss(dt, udt, state) {
    const b = boss;
    if (!b) return;

    if (b.dying) {
      b.deathT += udt;
      if (b.deathT >= num(TB.death && TB.death.duration, 2)) {
        clearBossWords(b);
        boss = null;
        beginBreather(wave + 1);
      }
      return;
    }

    if (phase === 'bossintro') {
      // choreography runs on real time: the world is at 30% speed during it.
      b.introT += udt;
      const p = U.clamp(b.introT / Math.max(0.05, b.introDur), 0, 1);
      b.targetY = U.lerp(num(TB.entryY, -70), num(TB.startY, 96), U.easeOutCubic(p));
      b.ySpring.v = b.targetY; b.ySpring.vel = 0;
      b.y = b.targetY;
      if (p >= 1) { phase = 'boss'; }
    } else {
      if (freezeT <= 0) {
        b.targetY += (num(TB.speed, 10) + num(TB.speedPerTier, 2) * (b.tier - 1)) * dt;
      }
      b.y = U.spring(b.ySpring, b.targetY,
        dt, num(TB.knockbackSpring.stiffness, 150), num(TB.knockbackSpring.damping, 9));
      // §7: one Rogue Token of harassment every 6s while the boss lives
      b.harassT -= dt;
      if (b.harassT <= 0) { b.harassT = num(TB.harassInterval, 6); spawnHarass(); }
    }
    b.vy = num(TB.speed, 10) + num(TB.speedPerTier, 2) * (b.tier - 1);

    // keep the word chain glued to the phrase body + collect external kills
    let livingH = b.h;
    for (let i = 0; i < b.words.length; i++) {
      const e = b.words[i];
      e.baseX = b.x + e.offsetX;
      e.x = e.baseX;
      e.y = b.y;
      if (e.h > livingH) livingH = e.h;
      if (!e.alive && !e.deathHandled) { handleBossWordDeath(e); if (!boss || boss.dying) return; }
    }
    b.h = livingH;
    if (b.y + livingH * 0.5 >= LEAK_Y) bossLeak(b, state);
  }

  // ------------------------------------------------------------------ per-enemy
  // §6 jailbreak: every 2.5s it dashes 120px diagonally, trailing a red streak.
  function startDash(e) {
    let dir = -e.dashDir;
    const half = e.w * 0.5 + 20;
    const dx = Math.sin(JL_ANG) * JL_DIST * dir;
    if (e.baseX + dx < half || e.baseX + dx > W - half) dir = -dir;
    e.dashDir = dir;
    e.dashDX = Math.sin(JL_ANG) * JL_DIST * dir;
    e.dashDY = Math.cos(JL_ANG) * JL_DIST;
    e.dashing = true; e.dashProg = 0; e.dashPrev = 0;
    e.dashT = 1;                                     // streak alpha, decays to 0
    e.dashX0 = e.x; e.dashY0 = e.y;
    e.dashTimer = 0;
    e.dashCount++;
    const n = Math.max(1, num(JL.streakCount, 4));
    for (let i = 0; i < n; i++) {
      FX.trail(e.x, e.y, {
        color: C.red, vx: e.dashDX * 2.2, vy: e.dashDY * 2.2,
        life: JL_STREAK * U.rand(0.6, 1), size: num(JL.streakWidth, 3),
        len: 0.05, alpha: 0.8, delay: i * 0.02, drag: 2.2
      });
    }
  }

  function updateEnemy(e, dt, udt, state) {
    e.ageT += dt;

    // materialize (§11.5) — not targetable until spawnT > 0.35
    if (e.spawnT < 1) {
      e.spawnT = Math.min(1, e.spawnT + dt / MAT_T);
      if (e.spawnT >= 1 && !e.snapped) {
        e.snapped = true;                              // "snap into the word with a small flash"
        FX.spark(e.x, e.y, { color: e.color, count: 5, speed: [50, 160], life: [0.12, 0.26], size: 2 });
      }
    }
    // per-letter consume-pop bookkeeping, so 50-render can do the §11 scale-pop
    // without 40-typing having to tell it anything.
    if (e.typed !== e.typedSeen) {
      if (e.typed > e.typedSeen) { e.popIndex = e.typed - 1; e.popT = 0; }
      e.typedSeen = e.typed;
    } else if (e.popT < 9) e.popT += dt;
    if (e.shakeT > 0) e.shakeT = Math.max(0, e.shakeT - dt);

    if (!e.measured) { sizeEnemy(e); if (e.kind !== 'bossword') clampX(e); }

    if (e.dying) {
      e.dieT += dt;
      e.alpha = Math.max(0, 1 - e.dieT / DYING_T);
      if (e.dieT >= DYING_T) remove(e);
      return;
    }
    // boss words are positioned by the boss itself
    if (e.kind === 'bossword') { e.alpha = 1; e.scale = e.baseScale; return; }

    const frozen = (freezeT > 0 && e.kind !== 'command');
    const moving = !frozen && e.spawnT >= 1;
    e.vy = moving ? e.baseSpeed * e.speedMul : 0;
    if (moving) e.y += e.vy * dt;

    // "slight individual wobble" (§6), under every type behaviour
    let x = e.baseX + Math.sin(e.wobblePhase + e.ageT * e.wobbleFreq * TAU) * WOBBLE;
    let alpha = 1;
    let scale = e.baseScale;

    switch (e.type) {
      case 'halluc': {
        // sine drift (amplitude 60px, period 3s) + 55% opacity + letter jitter
        x += Math.sin(e.sinePhase + e.ageT * TAU / HAL_PER) * HAL_AMP;
        alpha = HAL_OP * (1 - HAL_FD * (0.5 + 0.5 * Math.sin(e.ageT * TAU * HAL_FHZ)));
        e.jitterPx = HAL_JIT;                          // renderer: +/-1px per letter
        break;
      }
      case 'jail': {
        if (e.dashing) {
          e.dashProg += dt / JL_TIME;
          const p = Math.min(1, e.dashProg);
          const eased = U.easeOutCubic(p);
          const d = eased - e.dashPrev;
          e.dashPrev = eased;
          e.baseX += e.dashDX * d;
          e.y += e.dashDY * d;
          if (p >= 1) e.dashing = false;
          x = e.baseX + Math.sin(e.wobblePhase + e.ageT * e.wobbleFreq * TAU) * WOBBLE;
        } else if (moving) {
          e.dashTimer += dt;
          if (e.dashTimer >= JL_IV) startDash(e);
        }
        if (e.dashT > 0) e.dashT = Math.max(0, e.dashT - dt / JL_STREAK);
        break;
      }
      case 'overflow': {
        // slow tank; pulses larger the deeper it gets
        const depth = U.clamp((e.y - SPAWN_Y) / DEPTH_SPAN, 0, 1);
        const pulse = 0.5 + 0.5 * Math.sin(e.ageT * TAU / OVF_PER);
        e.pulse = pulse;
        scale = e.baseScale * (1 + OVF_GAIN * pulse * (0.35 + 0.65 * depth) + OVF_DEPTH * depth * 0.5);
        break;
      }
      case 'command': {
        const pulse = 0.5 + 0.5 * Math.sin(e.ageT * TAU / CMD_PER);
        e.pulse = pulse;
        scale = e.baseScale * (1 + CMD_GAIN * pulse);   // golden words pulse + sparkle
        e.sparkT -= dt;
        if (e.sparkT <= 0) {
          e.sparkT = CMD_SPARK_IV;
          FX.spark(e.x + U.rand(-e.w * 0.5, e.w * 0.5), e.y + U.rand(-e.h * 0.4, e.h * 0.4),
            { color: C.gold, count: CMD_SPARK_N, speed: [10, 60], life: [0.25, 0.5], size: 2 });
        }
        if (e.y >= CMD_DESPAWN) {                      // §10: leaks harmlessly
          FX.spark(e.x, e.y, { color: C.gold, count: 8, speed: [40, 140], life: [0.2, 0.4], size: 2 });
          remove(e);
          return;
        }
        break;
      }
      default: break;                                  // token / swarm: straight fall
    }

    e.x = x;
    e.scale = scale;
    e.alpha = alpha * U.lerp(0.2, 1, U.easeOutCubic(e.spawnT));

    // §6 leak: PI.Game.leak(e) exactly once, then the enemy is gone
    if (e.kind === 'enemy' && !e.leaked && (e.y + e.h * scale * 0.5) >= LEAK_Y) {
      e.leaked = true;
      if (e.tutorial && state !== 'PLAYING') {
        e.leaked = false;                              // title tutorial word just loops
        e.y = SPAWN_Y;
        e.typed = 0;
        return;
      }
      if (state === 'PLAYING') {
        const g = PI.Game;
        if (g && typeof g.leak === 'function') g.leak(e);
      }
      if (list.indexOf(e) >= 0) remove(e);
    }
  }

  // ------------------------------------------------------------------ director
  function announceWave(n) {
    if (bannerShownFor === n) return;
    bannerShownFor = n;
    banner('WAVE ' + n, { style: 'wave', color: C.green });
    snd('waveStart');
  }
  function beginBreather(next) {
    pendingWave = Math.max(1, Math.round(num(next, wave + 1)));
    phase = 'breather';
    phaseT = num(TW.breather, 2.5);
    announceWave(pendingWave);
  }
  function threats() {
    let n = 0;
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (e.kind === 'enemy' && e.alive && !e.dying && !e.tutorial) n++;
    }
    return n;
  }
  function onWaveCleared() {
    const g = PI.Game;
    if (g && typeof g.onWaveClear === 'function') { g.onWaveClear(wave); return; }
    const bonus = num(T.score && T.score.waveClearBonus, 0);
    if (bonus > 0 && PI.Score && typeof PI.Score.add === 'function') PI.Score.add(bonus, W * 0.5, H * 0.42);
  }

  function startWave(n) {
    let w = Math.round(num(n, wave + 1));
    if (!(w >= 1)) w = 1;
    hardClearBoss();
    purgeQueue.length = 0;
    wave = w;
    pendingWave = w;
    spawnedCount = 0;
    budget = num(TW.budget.base, 4) + Math.ceil(w * num(TW.budget.per, 1.5));
    spawnTimer = 0.45;
    phaseT = 0;
    idleGrace = 0;
    if (w % Math.max(1, num(TW.bossEvery, 5)) === 0) {
      budget = 0;                                        // §8: the boss *is* the budget
      beginBoss(w);
    } else {
      phase = 'spawning';
      announceWave(w);
    }
    return w;
  }

  function director(dt) {
    if (phase === 'spawning') {
      spawnTimer -= dt;
      if (spawnTimer <= 0 && spawnedCount < budget) {
        spawnFromRoster();
        spawnedCount++;
        spawnTimer = currentInterval();
      }
      if (spawnedCount >= budget) phase = 'clearing';
      return;
    }
    if (phase === 'clearing') {
      // §8: next wave once the budget is spent AND <= 2 enemies remain
      if (threats() <= num(TW.clearThreshold, 2)) {
        onWaveCleared();
        beginBreather(wave + 1);
      }
      return;
    }
    if (phase === 'breather') {
      phaseT -= dt;
      if (phaseT <= 0) startWave(pendingWave);
      return;
    }
  }

  // ------------------------------------------------------------------ lifecycle
  function remove(e) {
    if (!e) return false;
    const i = list.indexOf(e);
    if (i >= 0) {
      list[i] = list[list.length - 1];
      list.pop();
    }
    e.alive = false;
    if (e === commandOnScreen) commandOnScreen = null;
    // Safety net (§10): if a fully-typed command leaves the screen without its
    // effect having fired, fire it. The 0.3s window keeps a Game that already
    // called freeze()/purge()/stopSeq() itself from double-firing.
    if (e.kind === 'command' && !e.effectFired && e.typed >= e.word.length &&
        (U.now() - commandFiredAt) > 0.3) {
      e.effectFired = true;
      applyCommand(e.effect, e);
    }
    if (e.kind === 'bossword' && !e.deathHandled) handleBossWordDeath(e);
    const In = PI.Input;
    if (In && In.target === e && typeof In.release === 'function') In.release();
    return i >= 0;
  }

  function reset() {
    for (let i = 0; i < list.length; i++) list[i].alive = false;
    list.length = 0;
    if (boss) { boss.alive = false; boss.words.length = 0; }
    boss = null;
    bossTier = 0; bossesDefeated = 0;
    wave = num(TW.startWave, 1); pendingWave = wave;
    phase = 'idle'; phaseT = 0; idleGrace = 0;
    budget = 0; spawnedCount = 0; spawnTimer = 0;
    freezeT = 0;
    purgeQueue.length = 0; purgeTimer = 0;
    commandOnScreen = null; commandFiredAt = -99;
    cmdTimer = commandDelay();
    bannerShownFor = -1;
    nextId = 1;
  }

  function refreshTargetable() {
    const tw = targetableBossWord();
    let cmd = null;
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      let ok = e.alive && !e.dying && e.spawnT > 0.35;
      if (e.kind === 'bossword') ok = ok && (e === tw);
      e.targetable = !!ok;
      if (e.kind === 'command' && e.alive) cmd = e;
    }
    commandOnScreen = cmd;
  }

  function update(dt) {
    if (!(dt > 0)) dt = 0;
    const ts = (Core && typeof Core.timeScale === 'number' && Core.timeScale > 0.001) ? Core.timeScale : 1;
    const udt = dt / ts;                                 // ~real time (choreography)
    const state = (Core && Core.state) || 'PLAYING';
    // §14 auto-pause: paused means paused, even if Game keeps calling update().
    if (state === 'PAUSED') return;

    if (freezeT > 0) freezeT = Math.max(0, freezeT - dt);
    // the popcorn cascade only pops while the run is live (it scores)
    if (state === 'PLAYING') updatePurge(udt); else purgeQueue.length = 0;

    for (let i = list.length - 1; i >= 0; i--) {
      const e = list[i];
      if (i >= list.length) continue;                    // swap-removal shrank us
      if (!e || !e.alive) { if (list.indexOf(e) >= 0) remove(e); continue; }
      updateEnemy(e, dt, udt, state);
    }

    updateBoss(dt, udt, state);

    if (state === 'PLAYING') {
      // Safety net: if Game never called startWave(), start wave 1 anyway.
      if (phase === 'idle' && !boss) {
        idleGrace += dt;
        if (idleGrace > 0.75 && threats() === 0) startWave(Math.max(1, wave || 1));
      } else idleGrace = 0;
      director(dt);
      // §10: one command every ~25s (+/-5s), never two at once
      if (phase !== 'idle' && phase !== 'bossintro' && !commandOnScreen) {
        cmdTimer -= dt;
        if (cmdTimer <= 0) spawnCommand();
      }
    }

    refreshTargetable();
  }

  // ------------------------------------------------------------------ api
  const api = {
    list: list, reset: reset, update: update, spawn: spawn, startWave: startWave,
    freeze: freeze, purge: purge, stopSeq: stopSeq, remove: remove,
    targetableBossWord: targetableBossWord,
    // extras for the integrator: effect dispatch, boss bookkeeping, geometry
    applyCommand: applyCommand, bossWordKilled: bossWordKilled,
    spawnCommand: spawnCommand, spawnTutorial: spawnTutorial,
    measureEnemy: measureEnemy, letterPos: letterPos, nextChar: nextChar,
    nextBossWave: nextBossWave, threats: threats, leakLine: LEAK_Y,
    targetable: function (e) { return !!(e && e.targetable); }
  };
  // Live-state properties. Every one has a setter too, so a stray assignment
  // from another module can never throw in strict mode.
  function prop(name, get, set) {
    Object.defineProperty(api, name, { get: get, set: set || function () { }, enumerable: true });
  }
  prop('wave', function () { return wave; },
    function (v) { wave = Math.max(0, Math.round(num(v, wave))); });
  prop('boss', function () { return boss; },
    function (v) { if (v === null) hardClearBoss(); });
  prop('bossTier', function () { return bossTier; },
    function (v) { bossTier = Math.max(0, Math.round(num(v, bossTier))); });
  prop('commandOnScreen', function () { return commandOnScreen; },
    function (v) { if (v === null && commandOnScreen) remove(commandOnScreen); });
  prop('frozen', function () { return freezeT > 0; });
  prop('freezeT', function () { return freezeT; });
  prop('phase', function () { return phase; });
  prop('phaseT', function () { return phaseT; });
  prop('budget', function () { return budget; });
  prop('spawned', function () { return spawnedCount; });
  prop('speedMul', currentSpeedMul);
  prop('spawnInterval', currentInterval);
  prop('bossesDefeated', function () { return bossesDefeated; });
  prop('purging', function () { return purgeQueue.length > 0; });

  return api;
})();

/* ==== 40-typing.js ==== */
// 40-typing.js — PI.Input (targeting + keystroke model, DESIGN.md §4/§5) and
// PI.Score (score / combo / multiplier / FLOW STATE / persistence, DESIGN.md §9).
