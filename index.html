// Nothing here draws: Render reads .value/.combo/.multiplier()/.flow/.breakFlash
// and PI.Input.target/.accuracy() and paints them.

PI.Input = (function () {
  const U = PI.U, T = PI.TUNING;

  // A materializing enemy (§11.5 — 250ms glyph converge) is not targetable until
  // it is mostly assembled, so a keystroke can never lock something invisible.
  const MIN_SPAWN = 0.35;
  const DEATH_LOCKOUT = 0.6;               // §16: a mash must not skip the death screen
  const LEGAL = /^[a-z0-9 '\-=]$/;         // §4: the only typeable characters

  let totalKeys = 0, goodKeys = 0, localMuted = false;
  let seenState = null, deathAt = -1e9, justStamped = false;

  function now() { return (typeof U.now === 'function') ? U.now() : Date.now() / 1000; }
  function stateNow() { return (PI.Core && PI.Core.state) ? PI.Core.state : 'TITLE'; }
  function snd(fn, a) {
    const A = PI.Audio;
    if (A && typeof A[fn] === 'function') { try { A[fn](a); } catch (_) { /* audio never breaks play */ } }
  }
  // §13: one shared AudioContext, born inside a user gesture. Idempotent — Core
  // kicks it on keydown too.
  function initAudio() { snd('init'); }

  // Core gives Input no per-frame tick, so the death timestamp behind the [ENTER]
  // lockout is stamped the first time any entry point *observes* GAME_OVER — the
  // renderer calls PI.Input.accuracy() while drawing the death screen, so in
  // practice that is the death frame. `justStamped` lets the very first Enter
  // through if nothing observed the transition, rather than eating it.
  function watch() {
    const s = stateNow();
    justStamped = false;
    if (s !== seenState) {
      seenState = s;
      if (s === 'GAME_OVER') {
        deathAt = now();
        justStamped = true;
        // Safety net: persistence + the NEW HIGH SCORE stamp can't be forgotten.
        // save() is idempotent, so Game calling it in gameOver() is harmless.
        if (PI.Score && typeof PI.Score.save === 'function') PI.Score.save();
      }
    }
    return s;
  }
  function noteDeath() { seenState = 'GAME_OVER'; deathAt = now(); justStamped = false; }

  // ---------------------------------------------------------------- targeting
  function nextChar(e) {
    const w = e && e.word;
    if (typeof w !== 'string') return '';
    const i = e.typed | 0;
    return (i >= 0 && i < w.length) ? w.charAt(i) : '';
  }
  function ready(e) {
    if (!e || !e.alive || e.dying) return false;
    return ((typeof e.spawnT === 'number') ? e.spawnT : 1) > MIN_SPAWN;
  }

  // §7: only the leftmost living boss word is targetable. Entities owns that call
  // and its null is authoritative (it also locks the boss out during the 1.2s
  // intro choreography, §11.5) — the scan below is only a no-Entities fallback.
  function bossTarget() {
    const E = PI.Entities;
    if (!E) return null;
    if (typeof E.targetableBossWord === 'function') return E.targetableBossWord() || null;
    const boss = E.boss;
    if (boss && boss.words) {
      for (let i = 0; i < boss.words.length; i++) {
        const w = boss.words[i];
        if (w && w.alive && !w.dying && nextChar(w) !== '') return w;
      }
    }
    return null;
  }

  // §5: with no lock, the enemy NEAREST THE BOTTOM (greatest y) whose next
  // expected char matches wins, deterministically.
  function findCandidate(ch) {
    const E = PI.Entities;
    const list = (E && E.list) ? E.list : null;
    let best = null, bestY = -Infinity;
    if (list) {
      for (let i = 0; i < list.length; i++) {
        const e = list[i];
        if (!e || e.kind === 'bossword') continue;         // boss handled below
        if (!ready(e) || nextChar(e) !== ch) continue;
        const y = (typeof e.y === 'number') ? e.y : 0;
        if (y > bestY) { bestY = y; best = e; }
      }
    }
    const bw = bossTarget();
    if (bw && ready(bw) && nextChar(bw) === ch) {
      let y = (typeof bw.y === 'number') ? bw.y : 0;
      if (!y && E.boss && typeof E.boss.y === 'number') y = E.boss.y;
      if (y > bestY) best = bw;
    }
    return best;
  }

  // A lock survives until kill / Escape / the enemy leaving play. Consumed chars
  // stay on the enemy either way (§5: the typed prefix persists).
  function lockValid(e) {
    if (!e || !e.alive || e.dying || nextChar(e) === '') return false;
    if (e.kind === 'bossword') return bossTarget() === e;
    const list = (PI.Entities && PI.Entities.list) ? PI.Entities.list : null;
    return !(list && list.indexOf(e) < 0);
  }

  function release() { api.target = null; }

  // ---------------------------------------------------------------- feedback
  // Game.hit(e) owns the per-keystroke juice (muzzle flash, beam, letter pop,
  // sparks, rising blip). fallbackHit exists so a correct key is never silent if
  // Game ships without hit().
  function hit(e) {
    const G = PI.Game;
    if (G && typeof G.hit === 'function') { G.hit(e); return; }
    snd('key', e.typed);
    if (!PI.FX) return;
    const P = T.player, F = T.fx;
    const cfg = T.enemy[e.type];
    const cw = ((cfg && cfg.fontSize) || T.enemy.common.fontSize) * 0.6;  // mono advance ≈ 0.6em
    const lx = e.x - e.word.length * cw * 0.5 + ((e.typed | 0) - 0.5) * cw;
    PI.FX.beam(P.turretX, P.turretY, lx, e.y,
      { color: PI.C.green, life: F.beam.life, width: F.beam.width, bloom: F.beam.bloom });
    PI.FX.spark(lx, e.y, {
      color: e.color || PI.C.forType(e.type), count: F.keySpark.count,
      speed: F.keySpark.speed, life: F.keySpark.life, size: F.keySpark.size
    });
  }

  function kill(e) {
    const G = PI.Game;
    if (G && typeof G.killEnemy === 'function') { G.killEnemy(e); return; }
    if (PI.Score) PI.Score.onKill(e);
    if (PI.Entities && typeof PI.Entities.remove === 'function') PI.Entities.remove(e);
  }

  function typo(e) {
    const G = PI.Game;
    if (G && typeof G.typo === 'function') { G.typo(e || null); return; }
    if (PI.Score) PI.Score.breakCombo();
    snd('typo');
    if (PI.Core) PI.Core.addTrauma(T.juice.trauma.typo);
  }

  // ---------------------------------------------------------------- typing
  function typeKey(ch) {
    let e = api.target;
    if (e && !lockValid(e)) { release(); e = null; }

    if (!e) {
      e = findCandidate(ch);
      if (!e) {
        // §4: space is a real character (boss phrases are typed word by word), but
        // a space matching nothing is free — a habit key, never a typo.
        if (ch === ' ') return;
        totalKeys++; api.totalKeys = totalKeys;
        typo(null);
        return;
      }
      api.target = e;                // §5: the locking keystroke IS the first letter
    } else if (nextChar(e) !== ch) {
      if (ch === ' ') return;        // habitual space between boss words: ignored
      totalKeys++; api.totalKeys = totalKeys;
      typo(e);                       // §5: the lock is kept, only the combo dies
      return;
    }

    totalKeys++; api.totalKeys = totalKeys;
    goodKeys++; api.goodKeys = goodKeys;
    e.typed = (e.typed | 0) + 1;
    hit(e);
    if (e.typed >= e.word.length) {
      kill(e);
      if (api.target === e) api.target = null;
    }
  }

  function toggleMute() {
    const A = PI.Audio;
    if (A && typeof A.toggleMute === 'function') { A.toggleMute(); localMuted = !!A.muted; }
    else localMuted = !localMuted;
    snd('uiTick');                   // audible confirmation on un-mute
  }
  function newRun() {
    const G = PI.Game;
    if (G && typeof G.newRun === 'function') G.newRun();
  }
  function matchesLive(ch) {
    if (api.target && nextChar(api.target) === ch) return true;
    return !!findCandidate(ch);
  }

  function key(ch) {
    if (typeof ch !== 'string' || ch.length !== 1) return;
    ch = ch.toLowerCase();
    if (!LEGAL.test(ch)) return;

    const st = watch();
    initAudio();
    if (st === 'PLAYING') { typeKey(ch); return; }

    // MUTE POLICY (deliberate reading of §4): 'm' toggles mute only while NOT
    // playing. During play every printable key is a gameplay keystroke (§5) —
    // binding mute there would either swallow the 'm' of a word or turn a
    // legitimate keystroke into a typo. Title / death screens are where a player
    // actually reaches for it, and even there a live enemy expecting 'm' wins.
    if (ch === 'm' && !(st === 'TITLE' && matchesLive(ch))) { toggleMute(); return; }

    // Game owns the non-playing screens (title logo, tutorial enemy, death stats,
    // touch card), so it gets first refusal. `true` means "handled, stay out".
    const G = PI.Game;
    if (G && typeof G.titleKey === 'function' && G.titleKey(ch) === true) return;

    if (st === 'TITLE') {
      // §4/§16: the title spawns one slow tutorial enemy ('start'), so the title
      // screen is typable and a cold load reaches play in ≤2 keystrokes. A key
      // that matches nothing just starts the run instead of scolding the player.
      if (api.target || findCandidate(ch)) typeKey(ch);
      else newRun();
    }
    // GAME_OVER / PAUSED: [ENTER] retries (§3). Printable keys are ignored so
    // in-flight keystrokes cannot blow past the stats screen.
  }

  function enter() {
    const st = watch();
    initAudio();
    if (st === 'TITLE') { snd('uiTick'); newRun(); return; }
    if (st === 'GAME_OVER') {
      if (!justStamped && (now() - deathAt) < DEATH_LOCKOUT) return;
      snd('uiTick');
      newRun();
    }
  }

  function escape() {
    watch();
    if (api.target) { release(); snd('uiTick'); }      // §4: free action
  }

  function reset() {
    release();
    totalKeys = 0; goodKeys = 0;
    api.totalKeys = 0; api.goodKeys = 0;
  }

  function accuracy() {
    watch();                          // cheap frame hook: HUD / death screen call this
    if (totalKeys <= 0) return 1;
    return U.clamp(goodKeys / totalKeys, 0, 1);
  }

  const api = {
    target: null, totalKeys: 0, goodKeys: 0,
    key: key, enter: enter, escape: escape,
    release: release, reset: reset, accuracy: accuracy,
    toggleMute: toggleMute,
    noteDeath: noteDeath,             // Game/Score may stamp the death moment exactly
    candidate: findCandidate          // spawner can check first-letter clashes
  };
  Object.defineProperty(api, 'muted', {
    enumerable: true,
    get: function () {
      const A = PI.Audio;
      return (A && typeof A.muted === 'boolean') ? A.muted : localMuted;
    },
    set: function (v) { if (!!v !== api.muted) toggleMute(); }
  });
  return api;
})();


PI.Score = (function () {
  const U = PI.U, T = PI.TUNING;
  const TS = T.score, TC = T.combo, TF = T.flow, VIEW = T.view, HUD = T.hud;
  const TIER = Math.max(1, TC.tier || 5);          // ×(1 + floor(combo/5)) …
  const CAP = Math.max(1, TC.cap || 8);            // … capped ×8 (§9)
  const FLOW_AT = TF.threshold || 25;
  const FLOW_MUL = TF.multiplier || 2;
  const PER_LETTER = TS.perLetter || 10;
  const KEY_HIGH = TS.highKey || 'pi_highscore';
  const KEY_COMBO = TS.comboKey || 'pi_bestcombo';
  const STEPS = 8;                                 // kill melody wraps every 8 kills

  let value = 0, combo = 0, bestCombo = 0;
  let high = 0, highCombo = 0, isNewHigh = false, flow = false;
  let breakUntil = -1, comboAt = -1, tierAt = -1, flowAt = -1, lastTier = 1;

  const display = U.counter(0);
  // Where the combo counter cracks (§11.5). 50-render may overwrite x/y with the
  // real HUD position; this default is the top-right of the HUD band.
  const anchor = { x: VIEW.W - (HUD.pad || 24) - 46, y: (HUD.topY || 40) + 6 };

  function now() { return (typeof U.now === 'function') ? U.now() : Date.now() / 1000; }
  function snd(fn, a) {
    const A = PI.Audio;
    if (A && typeof A[fn] === 'function') { try { A[fn](a); } catch (_) { } }
  }
  function store() { try { return window.localStorage; } catch (_) { return null; } }
  function multOf(c) { return Math.min(CAP, 1 + Math.floor(c / TIER)); }
  function pint(v, min) { const n = Math.floor(v); return (isFinite(n) && n > min) ? n : min; }

  // Music intensity tracks the multiplier; FLOW pins it near the top (§11/§13).
  function pushIntensity() {
    const base = (CAP > 1) ? (multOf(combo) - 1) / (CAP - 1) : 0;
    snd('setIntensity', U.clamp(base * 0.7 + (flow ? 0.3 : 0), 0, 1));
  }

  // FLOW STATE is derived from combo, so this runs on every read of .flow and on
  // every multiplier() call; the transition side effects fire exactly once.
  function syncFlow() {
    const want = combo >= FLOW_AT;
    if (want === flow) return flow;
    flow = want;
    flowAt = now();
    if (flow) {
      snd('flowStart');
      if (PI.Core) {
        PI.Core.flash(0.10, 0.34, TF.tint || PI.C.cyan);
        PI.Core.addTrauma(0.18);
        PI.Core.punch(0.02, 0.3);
      }
      if (PI.FX) {
        PI.FX.ring(T.player.turretX, T.player.turretY,
          { color: TF.tint || PI.C.cyan, r0: 14, r1: 300, life: 0.6, width: 5 });
      }
    } else snd('flowEnd');
    pushIntensity();
    return flow;
  }

  function multiplier() { syncFlow(); return multOf(combo); }
  function totalMultiplier() { return multiplier() * (flow ? FLOW_MUL : 1); }
  function bump(p) { value = Math.max(0, value + p); display.set(value); }

  function popColor(total) {
    if (flow) return TF.tint || PI.C.cyan;
    if (total >= 6) return PI.C.gold;
    if (total >= 3) return PI.C.green;
    return PI.C.white;
  }
  function popupAt(x, y, text, color) {
    if (!PI.FX || typeof x !== 'number' || typeof y !== 'number') return;
    PI.FX.popup(x, y, text, {
      color: color, size: TS.popupSize, life: TS.popupLife,
      vy: TS.popupVy, scalePop: TS.popupScalePop
    });
  }

  // Flat award (boss kill reward, command bonus, wave clear). x/y optional popup.
  function add(points, x, y) {
    const p = Math.round(points);
    if (!isFinite(p) || p === 0) return value;
    bump(p);
    popupAt(x, y, (p > 0 ? '+' : '') + p, p > 0 ? PI.C.gold : PI.C.red);
    return value;
  }

  // §9: 10 × word length × combo multiplier × (FLOW ? 2 : 1). Boss-word and
  // boss-kill bonuses are added on top by PI.Game (§7).
  function onKill(e) {
    const word = (e && typeof e.word === 'string') ? e.word : '';
    const len = word.length || 1;

    combo++;
    if (combo > bestCombo) bestCombo = combo;
    comboAt = now();
    syncFlow();

    const mult = multOf(combo);
    if (mult !== lastTier) { lastTier = mult; tierAt = now(); }   // tier ring pulse
    const total = mult * (flow ? FLOW_MUL : 1);
    const pts = Math.round(PER_LETTER * len * total);
    bump(pts);

    const x = (e && typeof e.x === 'number') ? e.x : VIEW.W * 0.5;
    const y = (e && typeof e.y === 'number') ? e.y : VIEW.H * 0.5;
    popupAt(x, y - 16, '+' + pts + (total > 1 ? ' ×' + total : ''), popColor(total));

    snd('kill', (combo - 1) % STEPS);          // combos literally play a melody
    pushIntensity();
    return pts;
  }

  // §9: a typo or a leak resets the combo — glass shatter, the counter cracks into
  // falling shards, desaturation blink (Render reads PI.Score.breakFlash).
  function breakCombo() {
    const had = combo;
    combo = 0;
    comboAt = now();
    lastTier = 1;
    syncFlow();                                // exits FLOW if it was active
    if (had <= 0) { pushIntensity(); return; }  // nothing to shatter
    breakUntil = now() + (TC.breakDesaturate || 0.22);
    snd('comboBreak');
    if (PI.FX) {
      PI.FX.shard(anchor.x, anchor.y, {
        color: PI.C.red, count: TC.breakShards, text: '×' + multOf(had),
        size: (HUD.comboSize || 40) * 0.7,
        life: TC.breakShardLife, gravity: TC.breakShardGravity
      });
      PI.FX.ring(anchor.x, anchor.y, { color: PI.C.red, r0: 6, r1: 74, life: 0.34, width: 2 });
    }
    pushIntensity();
  }

  function reset() {
    value = 0; combo = 0; bestCombo = 0; isNewHigh = false;
    breakUntil = -1; comboAt = -1; tierAt = -1; flowAt = -1; lastTier = 1;
    if (flow) { flow = false; snd('flowEnd'); }
    if (typeof display.snap === 'function') display.snap(0); else display.set(0);
    pushIntensity();
  }

  function load() {
    const ls = store();
    if (!ls) return;
    try {
      const h = parseInt(ls.getItem(KEY_HIGH), 10);
      if (isFinite(h) && h > high) high = h;
    } catch (_) { }
    try {
      const c = parseInt(ls.getItem(KEY_COMBO), 10);
      if (isFinite(c) && c > highCombo) highCombo = c;
    } catch (_) { }
  }

  // Called from PI.Game.gameOver(); also fired by Input the frame it observes
  // GAME_OVER, so persistence can't be missed. Idempotent. Sets isNewHigh for the
  // NEW HIGH SCORE stamp (§9) — the sting/confetti stay Game's call so they fire once.
  function save() {
    if (value > 0 && value > high) { high = value; isNewHigh = true; }
    if (bestCombo > highCombo) highCombo = bestCombo;
    const ls = store();
    if (ls) {
      try { ls.setItem(KEY_HIGH, String(Math.round(high))); } catch (_) { }
      try { ls.setItem(KEY_COMBO, String(Math.round(highCombo))); } catch (_) { }
    }
    return isNewHigh;
  }

  // Convenience for PI.Game.update(dt) — advances the tweened score readout.
  // Game may equally call PI.Score.display.update(dt) itself.
  function update(dt) { display.update(dt); return display.value; }

  function setCombo(n) {
    combo = pint(n, 0);
    if (combo > bestCombo) bestCombo = combo;
    comboAt = now();
    lastTier = multOf(combo);
    syncFlow();
  }

  const api = {
    display: display, comboAnchor: anchor,
    multiplier: multiplier, totalMultiplier: totalMultiplier,
    reset: reset, add: add, onKill: onKill, breakCombo: breakCombo,
    load: load, save: save, update: update
  };
  function def(name, get, set) {
    Object.defineProperty(api, name, { enumerable: true, get: get, set: set });
  }
  const NOP = function () { };        // derived props keep a setter so a stray
                                     // assignment can't throw under 'use strict'
  def('value', function () { return value; },
    function (v) { value = pint(Math.round(v), 0); display.set(value); });
  def('combo', function () { return combo; }, setCombo);
  def('bestCombo', function () { return bestCombo; }, function (v) { bestCombo = pint(v, 0); });
  def('high', function () { return high; }, function (v) { high = pint(Math.round(v), 0); });
  // All-time best combo (localStorage 'pi_bestcombo'); bestCombo is this run's.
  def('highCombo', function () { return highCombo; }, function (v) { highCombo = pint(v, 0); });
  def('bestComboEver', function () { return highCombo; }, function (v) { api.highCombo = v; });
  def('isNewHigh', function () { return isNewHigh; }, function (v) { isNewHigh = !!v; });
  def('flow', function () { return syncFlow(); }, NOP);
  def('tier', function () { return multOf(combo); }, NOP);
  // Seconds of desaturation blink left after a combo break (0 = inactive).
  def('breakFlash', function () { return Math.max(0, breakUntil - now()); }, NOP);
  // Seconds since combo / tier / FLOW last changed — Render drives the combo
  // squash-stretch, the tier ring pulse and the flow ramp off these.
  def('comboAge', function () { return comboAt < 0 ? 999 : Math.max(0, now() - comboAt); }, NOP);
  def('tierAge', function () { return tierAt < 0 ? 999 : Math.max(0, now() - tierAt); }, NOP);
  def('flowAge', function () { return flowAt < 0 ? 999 : Math.max(0, now() - flowAt); }, NOP);

  load();      // title screen shows the persisted high score on a cold load
  return api;
})();

/* ==== 50-render.js ==== */
// PI.Render — every pixel except the particle layer (DESIGN.md §11, §11.5, §13).
//
// Draw calls run inside Core's logical 1280x720 transform, with the camera punch and
// trauma shake already applied — except overlay(), which Core draws outside the shake
// so the CRT and vignette stay nailed to the screen.
//
// Performance rules from §14: static layers (scanlines, vignette) are pre-rendered to
// offscreen canvases once and blitted; the code-rain grid is generated once and only
// its offsets advance; the font string is cached to avoid re-parsing every draw; and
// nothing here uses shadowBlur or ctx.filter.

PI.Render = (function () {
  const U = PI.U, C = PI.C, T = PI.TUNING, FONT = PI.FONT;
  const W = T.view.W, H = T.view.H;
  const HUD = T.hud, J = T.juice, CB = T.hud.contextBar, TP = T.player;
  const TAU = Math.PI * 2;

  function num(v, d) { return (typeof v === 'number' && isFinite(v)) ? v : d; }
  function state() { return PI.Core ? PI.Core.state : 'TITLE'; }
  function integrity() { return PI.Game ? num(PI.Game.integrity, 100) : 100; }
  function clockT() { return PI.Core ? num(PI.Core.time, 0) : 0; }

  // ------------------------------------------------------------------ fonts
  // Assigning ctx.font re-parses the shorthand, so only do it on change. The cache
  // is invalidated once per frame because other modules (enemy measuring) touch it.
  let fontCache = '';
  function font(ctx, size, weight) {
    const f = (weight ? weight + ' ' : '') + Math.round(size) + 'px ' + FONT;
    if (f !== fontCache) { ctx.font = f; fontCache = f; }
  }
  function invalidateFont() { fontCache = ''; }

  // ------------------------------------------------------- offscreen layers
  let scanLayer = null, vignetteLayer = null, lowLayer = null;

  function makeLayer(w, h) {
    try {
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w));
      c.height = Math.max(1, Math.round(h));
      return c;
    } catch (_) { return null; }
  }

  function ensureLayers() {
    if (scanLayer === null) {
      // One tile of scanlines, repeated by a pattern fill — cheaper than a gradient
      // stroke per row and pixel-exact at logical scale.
      const step = Math.max(2, num(J.scanlineSize, 2));
      const c = makeLayer(4, step);
      if (c) {
        const g = c.getContext('2d');
        g.clearRect(0, 0, 4, step);
        g.fillStyle = 'rgba(0,0,0,' + num(J.scanlineAlpha, 0.075) + ')';
        g.fillRect(0, 0, 4, Math.max(1, step / 2));
      }
      scanLayer = c || false;
    }
    if (vignetteLayer === null) {
      const c = makeLayer(W, H);
      if (c) {
        const g = c.getContext('2d');
        const grad = g.createRadialGradient(W * 0.5, H * 0.5, H * 0.28, W * 0.5, H * 0.5, H * 0.82);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,' + num(J.vignette, 0.5) + ')');
        g.fillStyle = grad;
        g.fillRect(0, 0, W, H);
      }
      vignetteLayer = c || false;
    }
    if (lowLayer === null) {
      // Red heartbeat vignette for the sub-30% integrity state.
      const c = makeLayer(W, H);
      if (c) {
        const g = c.getContext('2d');
        const grad = g.createRadialGradient(W * 0.5, H * 0.55, H * 0.2, W * 0.5, H * 0.55, H * 0.85);
        grad.addColorStop(0, 'rgba(255,45,63,0)');
        grad.addColorStop(1, 'rgba(255,45,63,0.55)');
        g.fillStyle = grad;
        g.fillRect(0, 0, W, H);
      }
      lowLayer = c || false;
    }
  }

  // -------------------------------------------------------------- code rain
  // Two parallax layers of drifting glyphs. Reactive to the score multiplier per
  // §11.5: the whole field speeds up and shifts toward cyan as the player heats up.
  const TR = T.fx.rain;
  const rain = { far: [], near: [], ready: false };

  function makeColumns(count, size, speed) {
    const cols = [];
    const gap = num(TR.columnGap, 30);
    for (let i = 0; i < count; i++) {
      const glyphs = [];
      const n = Math.ceil(H / size) + 2;
      for (let k = 0; k < n; k++) glyphs.push(U.pick(U.GLYPHS_ASCII || U.GLYPHS));
      cols.push({
        x: (i * gap + U.rand(0, gap)) % W,
        y: U.rand(-H, 0),
        speed: speed * U.rand(0.7, 1.35),
        size: size,
        glyphs: glyphs,
        rollT: U.rand(0, 1),
      });
    }
    return cols;
  }

  function initRain() {
    rain.far = makeColumns(num(TR.farCount, 60), num(TR.farSize, 13), num(TR.farSpeed, 26));
    rain.near = makeColumns(num(TR.nearCount, 40), num(TR.nearSize, 17), num(TR.nearSpeed, 62));
    rain.offFar = 0;
    rain.offNear = 0;
    rain.ready = true;
  }

  // Drawing the glyph field per character cost ~4,300 fillText calls a frame and put
  // the game under 55fps on a software rasteriser. Each layer is pre-rendered once into
  // a vertically tileable strip and blitted twice per frame instead; the hue shift
  // cross-fades a second, cyan copy. Strip height is a whole multiple of the glyph step
  // so the seam is invisible.
  const strips = { ready: false, far: null, farCyan: null, near: null, nearCyan: null, farH: 0, nearH: 0 };

  function buildStrip(cols, size, color) {
    const stripH = Math.ceil(H / size) * size;
    const c = makeLayer(W, stripH);
    if (!c) return null;
    const g = c.getContext('2d');
    g.font = Math.round(size) + 'px ' + FONT;
    g.textAlign = 'left';
    g.textBaseline = 'alphabetic';
    g.fillStyle = color;
    const rows = Math.ceil(stripH / size);
    for (let i = 0; i < cols.length; i++) {
      const col = cols[i];
      for (let k = 0; k < rows; k++) {
        g.fillText(col.glyphs[k % col.glyphs.length], col.x, k * size + size);
      }
    }
    return { canvas: c, h: stripH };
  }

  function ensureStrips() {
    if (strips.ready) return;
    if (!rain.ready) initRain();
    const fs = num(TR.farSize, 13), ns = num(TR.nearSize, 17);
    const f = buildStrip(rain.far, fs, C.rainFar);
    const fc = buildStrip(rain.far, fs, C.cyan);
    const n = buildStrip(rain.near, ns, C.rain);
    const nc = buildStrip(rain.near, ns, C.cyan);
    strips.far = f && f.canvas; strips.farH = f ? f.h : 0;
    strips.farCyan = fc && fc.canvas;
    strips.near = n && n.canvas; strips.nearH = n ? n.h : 0;
    strips.nearCyan = nc && nc.canvas;
    strips.ready = true;
  }

  function heat() {
    // 0..1 excitement level from the combo multiplier, pinned high in flow state.
    const S = PI.Score;
    if (!S) return 0;
    const m = typeof S.multiplier === 'function' ? S.multiplier() : 1;
    const base = U.clamp((m - 1) / Math.max(1, num(T.combo.cap, 8) - 1), 0, 1);
    return S.flow ? Math.max(0.85, base) : base;
  }

  function advanceRain(dt) {
    if (!rain.ready) initRain();
    const boost = 1 + num(TR.comboSpeedGain, 0.9) * heat();
    rain.offFar += num(TR.farSpeed, 26) * boost * dt;
    rain.offNear += num(TR.nearSpeed, 62) * boost * dt;
  }

  function displaceAt(x, y, out) {
    // Boss-death shockwaves bend the background: push glyphs radially away from
    // each live displacement, strongest right at the ring's edge.
    out.x = x; out.y = y;
    const D = PI.FX && PI.FX.displacements;
    if (!D || !D.length) return out;
    for (let i = 0; i < D.length; i++) {
      const d = D[i];
      const dx = x - d.x, dy = y - d.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const band = Math.abs(dist - d.r);
      if (band > 140) continue;
      const amt = (1 - band / 140) * d.strength;
      out.x += (dx / dist) * amt;
      out.y += (dy / dist) * amt;
    }
    return out;
  }

  const dispOut = { x: 0, y: 0 };

  function blitStrip(ctx, canvas, stripH, offset, alpha) {
    if (!canvas || alpha <= 0.004) return;
    const off = ((offset % stripH) + stripH) % stripH;
    ctx.globalAlpha = alpha;
    ctx.drawImage(canvas, 0, off - stripH);
    ctx.drawImage(canvas, 0, off);
    ctx.globalAlpha = 1;
  }

  // Per-glyph path, used only while a shockwave is bending the field (boss death).
  function drawRainDisplaced(ctx, cols, size, offset, alpha, color) {
    const stripH = Math.ceil(H / size) * size;
    const off = ((offset % stripH) + stripH) % stripH;
    const rows = Math.ceil(stripH / size);
    ctx.fillStyle = U.hexA(color, alpha);
    font(ctx, size);
    for (let i = 0; i < cols.length; i++) {
      const col = cols[i];
      for (let k = 0; k < rows; k++) {
        const gy = k * size + size + off - stripH;
        const gy2 = gy + stripH;
        for (let pass = 0; pass < 2; pass++) {
          const yy = pass === 0 ? gy : gy2;
          if (yy < -size || yy > H + size) continue;
          const pt = displaceAt(col.x, yy, dispOut);
          ctx.fillText(col.glyphs[k % col.glyphs.length], pt.x, pt.y);
        }
      }
    }
  }

  // A handful of glyphs redrawn each frame keeps the field alive now that the bulk of
  // it is a static blit.
  function drawRainFlicker(ctx, dt) {
    const n = 22;
    font(ctx, num(TR.nearSize, 17));
    ctx.fillStyle = U.hexA(heat() > 0.02 ? C.cyan : C.green, 0.5);
    for (let i = 0; i < n; i++) {
      ctx.fillText(U.pick(U.GLYPHS_ASCII || U.GLYPHS), U.rand(0, W), U.rand(0, H));
    }
  }

  function background(ctx, dt) {
    invalidateFont();
    ensureLayers();
    ensureStrips();
    advanceRain(num(dt, 0));

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    const h = heat();
    const shift = U.clamp(num(TR.comboHueShift, 0.85) * h, 0, 1);
    const farA = num(TR.farAlpha, 0.16);
    const nearA = num(TR.nearAlpha, 0.3);
    const bending = !!(PI.FX && PI.FX.displacements && PI.FX.displacements.length);

    if (bending) {
      drawRainDisplaced(ctx, rain.far, num(TR.farSize, 13), rain.offFar, farA, shift > 0.02 ? C.cyan : C.rainFar);
      drawRainDisplaced(ctx, rain.near, num(TR.nearSize, 17), rain.offNear, nearA, shift > 0.02 ? C.cyan : C.rain);
    } else {
      blitStrip(ctx, strips.far, strips.farH, rain.offFar, farA * (1 - shift));
      blitStrip(ctx, strips.farCyan, strips.farH, rain.offFar, farA * shift);
      blitStrip(ctx, strips.near, strips.nearH, rain.offNear, nearA * (1 - shift));
      blitStrip(ctx, strips.nearCyan, strips.nearH, rain.offNear, nearA * shift);
      drawRainFlicker(ctx, dt);
    }

    // Freeze tint while temp=0 is active.
    const E = PI.Entities;
    if (E && E.frozen) {
      ctx.fillStyle = U.hexA(T.commands.freeze.tint || C.cyan, num(T.commands.freeze.tintAlpha, 0.12));
      ctx.fillRect(0, 0, W, H);
    }
    // Flow-state wash.
    if (PI.Score && PI.Score.flow) {
      ctx.fillStyle = U.hexA(T.flow.tint || C.cyan, num(T.flow.tintAlpha, 0.075));
      ctx.fillRect(0, 0, W, H);
    }
    if (vignetteLayer) ctx.drawImage(vignetteLayer, 0, 0);
  }

  // --------------------------------------------------------------- enemies
  const EC = T.enemy.common;

  function typedColor(e) {
    return C.dim;
  }

  function capsule(ctx, x, y, w, h, r) {
    const rr = Math.min(r, h * 0.5, w * 0.5);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
    ctx.lineTo(x + w, y + h - rr);
    ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    ctx.lineTo(x + rr, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
    ctx.lineTo(x, y + rr);
    ctx.quadraticCurveTo(x, y, x + rr, y);
    ctx.closePath();
  }

  // Faked bloom: a layered radial gradient. shadowBlur is banned in the draw path.
  //
  // Building a gradient per glow meant one createRadialGradient per enemy per frame.
  // Gradients are position-independent if built at the origin and drawn through a
  // translate, so they are cached by colour/alpha/radius bucket and reused.
  const glowCache = new Map();
  function glowGradient(ctx, radius, color, alpha) {
    const rq = Math.max(4, Math.round(radius / 4) * 4);
    const aq = Math.round(U.clamp(alpha, 0, 1) * 20) / 20;
    const key = color + '|' + aq + '|' + rq;
    let g = glowCache.get(key);
    if (!g) {
      g = ctx.createRadialGradient(0, 0, 0, 0, 0, rq);
      g.addColorStop(0, U.hexA(color, aq));
      g.addColorStop(0.55, U.hexA(color, aq * 0.35));
      g.addColorStop(1, U.hexA(color, 0));
      if (glowCache.size > 240) glowCache.clear();
      glowCache.set(key, g);
    }
    return { grad: g, r: rq };
  }

  function glow(ctx, x, y, radius, color, alpha) {
    if (alpha <= 0.004 || radius <= 0) return;
    const c = glowGradient(ctx, radius, color, alpha);
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = c.grad;
    ctx.fillRect(-c.r, -c.r, c.r * 2, c.r * 2);
    ctx.restore();
  }

  function drawEnemy(ctx, e) {
    if (!e || !e.alive) return;
    const E = PI.Entities;
    if (E && E.measureEnemy) E.measureEnemy(e, ctx);

    const sp = U.clamp(num(e.spawnT, 1), 0, 1);
    // Materialize with a slight overshoot, then settle (§11.5).
    const inScale = sp >= 1 ? 1 : U.easeOutBack(sp);
    const dieP = e.dying ? U.clamp(num(e.dieT, 0) / Math.max(0.01, num(EC.dyingTime, 0.18)), 0, 1) : 0;
    const scale = num(e.scale, 1) * inScale * (1 + dieP * 0.35);
    let alpha = num(e.alpha, 1) * (sp >= 1 ? 1 : sp) * (1 - dieP);

    if (e.type === 'halluc') {
      const flick = 1 - num(T.enemy.halluc.flickerDepth, 0.18) *
        (0.5 + 0.5 * Math.sin(clockT() * TAU * num(T.enemy.halluc.flickerHz, 9) + e.wobblePhase));
      alpha *= num(T.enemy.halluc.opacity, 0.55) * flick;
    }
    if (alpha <= 0.01) return;

    const size = num(e.fontSize, EC.fontSize) * scale;
    const cw = num(e.charW, size * 0.6) * scale;
    const n = e.word.length;
    const textW = cw * n;
    const isTarget = PI.Input && PI.Input.target === e;
    const color = e.color || C.white;

    // Typo shake, set by Game.typo(e).
    let shx = 0;
    if (num(e.shakeT, 0) > 0) {
      const k = e.shakeT / Math.max(0.01, num(J.typoShakeTime, 0.22));
      shx = Math.sin(e.shakeT * 90) * num(J.typoShake, 6) * k;
    }

    const cx = num(e.x, W * 0.5) + shx + num(e.offsetX, 0);
    const cy = num(e.y, 0);

    ctx.globalAlpha = 1;

    // capsule + glow
    const padX = num(EC.capsulePadX, 11) * scale;
    const padY = num(EC.capsulePadY, 7) * scale;
    const boxW = textW + padX * 2;
    const boxH = size + padY * 2;
    const bx = cx - boxW * 0.5;
    const by = cy - boxH * 0.5;

    ctx.globalCompositeOperation = 'lighter';
    glow(ctx, cx, cy, Math.max(boxW, boxH) * (isTarget ? 0.95 : 0.72),
      color, num(EC.glowAlpha, 0.3) * alpha * (isTarget ? 1.5 : 1));
    ctx.globalCompositeOperation = 'source-over';

    ctx.fillStyle = U.hexA(C.ink, 0.55 * alpha);
    capsule(ctx, bx, by, boxW, boxH, num(EC.capsuleRadius, 6) * scale);
    ctx.fill();
    ctx.strokeStyle = U.hexA(color, 0.5 * alpha);
    ctx.lineWidth = 1;
    ctx.stroke();

    // jailbreak dash streak
    if (e.dashing && e.dashProg > 0) {
      ctx.strokeStyle = U.hexA(C.red, 0.5 * alpha * (1 - e.dashProg));
      ctx.lineWidth = num(T.enemy.jail.streakWidth, 3) * scale;
      ctx.beginPath();
      ctx.moveTo(cx - num(e.dashDX, 0) * 26, cy - num(e.dashDY, 0) * 26);
      ctx.lineTo(cx, cy);
      ctx.stroke();
    }

    // letters: consumed dim, remaining bright, struck letter pops
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const jit = e.jitter ? num(T.enemy.halluc.jitter, 1) : 0;
    const popIdx = num(e.popIndex, -1);
    const popT = num(e.popT, 99);
    const popDur = num(EC.letterPop, 0.05);

    for (let i = 0; i < n; i++) {
      const lx = cx - textW * 0.5 + cw * (i + 0.5) + (jit ? U.rand(-jit, jit) : 0);
      const ly = cy + (jit ? U.rand(-jit, jit) : 0);
      const consumed = i < e.typed;
      let ls = size;
      if (i === popIdx && popT < popDur) {
        const k = popT / popDur;
        // 1.0 -> 1.4 -> 1.0 over the pop window
        ls = size * (1 + (num(EC.letterPopScale, 1.4) - 1) * Math.sin(k * Math.PI));
      }
      font(ctx, ls, consumed ? '' : 'bold');
      ctx.fillStyle = consumed ? U.hexA(typedColor(e), alpha * 0.85) : U.hexA(color, alpha);
      ctx.fillText(e.word.charAt(i), lx, ly);
    }

    // lock brackets + targeting line
    if (isTarget) {
      const bp = num(EC.bracketPad, 8) * scale;
      const pulse = 0.7 + 0.3 * Math.sin(clockT() * 9);
      ctx.strokeStyle = U.hexA(C.green, 0.9 * pulse);
      ctx.lineWidth = 2;
      const x0 = bx - bp, x1 = bx + boxW + bp;
      const yTop = by - bp * 0.4, yBot = by + boxH + bp * 0.4;
      const armY = (yBot - yTop) * 0.3;
      const armX = 9;
      ctx.beginPath();
      ctx.moveTo(x0 + armX, yTop); ctx.lineTo(x0, yTop); ctx.lineTo(x0, yTop + armY);
      ctx.moveTo(x0, yBot - armY); ctx.lineTo(x0, yBot); ctx.lineTo(x0 + armX, yBot);
      ctx.moveTo(x1 - armX, yTop); ctx.lineTo(x1, yTop); ctx.lineTo(x1, yTop + armY);
      ctx.moveTo(x1, yBot - armY); ctx.lineTo(x1, yBot); ctx.lineTo(x1 - armX, yBot);
      ctx.stroke();

      ctx.strokeStyle = U.hexA(C.green, 0.18);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(num(TP.turretX, 640), num(TP.turretY, 634));
      ctx.lineTo(cx, cy + boxH * 0.5);
      ctx.stroke();
    }
  }

  function drawBoss(ctx, b) {
    if (!b || !b.alive) return;
    // Alert sweep during the intro (§11.5): a red band crossing the screen.
    const E = PI.Entities;
    if (E && E.phase === 'bossintro') {
      const p = U.clamp(num(b.introT, 0) / Math.max(0.05, num(b.introDur, 1.2)), 0, 1);
      const sweepY = -80 + (H + 160) * U.easeOutCubic(p);
      const g = ctx.createLinearGradient(0, sweepY - 70, 0, sweepY + 70);
      g.addColorStop(0, U.hexA(C.red, 0));
      g.addColorStop(0.5, U.hexA(C.red, num(T.boss.intro.sweep, 0.85) * 0.4 * (1 - p * 0.5)));
      g.addColorStop(1, U.hexA(C.red, 0));
      ctx.fillStyle = g;
      ctx.fillRect(0, sweepY - 70, W, 140);
    }
    // The phrase's words are ordinary enemy records, so they draw through the same path.
    for (let i = 0; i < b.words.length; i++) {
      const wd = b.words[i];
      if (!wd || !wd.alive) continue;
      const isNext = (PI.Entities && PI.Entities.targetableBossWord && PI.Entities.targetableBossWord() === wd);
      if (!isNext && !wd.dying) wd.alpha = 0.62;
      else wd.alpha = 1;
      drawEnemy(ctx, wd);
    }
  }

  function enemies(ctx) {
    const E = PI.Entities;
    if (!E) return;
    const list = E.list || [];
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (e && e.kind !== 'bossword') drawEnemy(ctx, e);
    }
    if (E.boss) drawBoss(ctx, E.boss);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------------------------------------------------------------- turret
  const tur = { rot: { v: 0, vel: 0 }, recoil: 0, muzzle: 0, afterT: 0 };

  function fire() {
    // Called by Game.hit() — recoil + muzzle flash.
    tur.recoil = num(TP.recoilPx, 3);
    tur.muzzle = num(TP.muzzleFlashLife, 0.07);
  }

  function turretAngle() {
    // Recentre when a run is not in progress: a turret frozen mid-aim on the death
    // screen reads as a broken sprite rather than a paused game.
    if (state() !== 'PLAYING' && state() !== 'PAUSED') return 0;
    const t = PI.Input && PI.Input.target;
    if (!t) return 0;
    const dx = num(t.x, W * 0.5) - num(TP.turretX, 640);
    const dy = num(t.y, 0) - num(TP.turretY, 634);
    return U.clamp(Math.atan2(dx, -dy), -num(TP.rotClamp, 1.15), num(TP.rotClamp, 1.15));
  }

  function drawTurret(ctx) {
    if (state() === 'TITLE' && !(PI.Entities && PI.Entities.list && PI.Entities.list.length)) return;
    const x = num(TP.turretX, 640);
    const y = num(TP.turretY, 634);
    const breath = 1 + num(TP.breathAmp, 0.14) *
      Math.sin(clockT() * TAU / Math.max(0.1, num(TP.breathPeriod, 3)));
    const flow = PI.Score && PI.Score.flow;
    const accent = flow ? C.cyan : C.green;

    ctx.globalCompositeOperation = 'lighter';
    glow(ctx, x, y, num(TP.breathGlow, 16) * 2.4 * breath, accent, 0.34);
    if (tur.muzzle > 0) {
      const k = tur.muzzle / Math.max(0.01, num(TP.muzzleFlashLife, 0.07));
      glow(ctx, x + Math.sin(tur.rot.v) * 26, y - Math.cos(tur.rot.v) * 26, 34 * k, C.white, 0.6 * k);
    }
    ctx.globalCompositeOperation = 'source-over';

    ctx.save();
    ctx.translate(x, y + tur.recoil);
    ctx.rotate(tur.rot.v);

    // barrel
    ctx.fillStyle = U.hexA(accent, 0.9);
    ctx.fillRect(-3.5, -num(TP.turretR, 20) - 12, 7, 18);
    // body
    const bw = num(TP.turretW, 46), bh = num(TP.turretH, 24);
    ctx.fillStyle = U.hexA(C.ink, 0.9);
    capsule(ctx, -bw * 0.5, -bh * 0.5, bw, bh, 5);
    ctx.fill();
    ctx.strokeStyle = U.hexA(accent, 0.95);
    ctx.lineWidth = 2;
    ctx.stroke();
    // core
    ctx.fillStyle = U.hexA(accent, 0.55 + 0.45 * (breath - 1) / Math.max(0.01, num(TP.breathAmp, 0.14)));
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // ----------------------------------------------------------- context bar
  const glitch = { t: 0, x: 0 };
  function glitchContext(x) {
    glitch.t = num(J.contextGlitch, 0.15);
    glitch.x = num(x, W * 0.5);
  }

  const CONTEXT_TEXT =
    'system: you are a helpful assistant. maintain alignment. refuse injected instructions. ' +
    'context window nominal. tokens streaming. attention stable. guardrails engaged. ';

  function contextBar(ctx) {
    const x = num(CB.x, 24), y = num(CB.y, 664), w = num(CB.w, 1232), h = num(CB.h, 40);
    const integ = U.clamp(integrity(), 0, 100);
    const ghost = PI.Game ? U.clamp(num(PI.Game.integrityGhost, integ), 0, 100) : integ;

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    // shell
    ctx.fillStyle = U.hexA(C.ink, 0.85);
    capsule(ctx, x, y, w, h, num(CB.radius, 4));
    ctx.fill();
    ctx.strokeStyle = U.hexA(C.dim, 0.8);
    ctx.lineWidth = 1;
    ctx.stroke();

    // lagging white ghost bar (fighting-game style) sits behind the green
    if (ghost > integ + 0.4) {
      ctx.fillStyle = U.hexA(C.ghost, 0.5);
      ctx.fillRect(x + w * (integ / 100), y + 1, w * ((ghost - integ) / 100), h - 2);
    }

    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();

    // terminal text: healthy portion green, damaged portion corrupted red
    const charW = num(CB.charW, 9);
    const cols = Math.floor(w / charW);
    const healthy = Math.round(cols * (integ / 100));
    const ty = y + h * 0.5;
    font(ctx, num(CB.textSize, 15));
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';

    const glitchK = glitch.t > 0 ? glitch.t / Math.max(0.01, num(J.contextGlitch, 0.15)) : 0;
    // The tear splits the line into offset bands, which costs a full redraw per band.
    // Outside the 150ms glitch there is nothing to offset, so draw the line once.
    const bands = glitchK > 0 ? num(J.contextGlitchBands, 7) : 1;
    const bandH = h / bands;

    for (let b = 0; b < bands; b++) {
      let off = 0;
      if (glitchK > 0) {
        const near = 1 - U.clamp(Math.abs((x + charW * healthy) - glitch.x) / 400, 0, 1);
        off = (Math.random() - 0.5) * num(J.contextGlitchAmp, 14) * glitchK * (0.35 + near);
      }
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y + b * bandH, w, bandH);
      ctx.clip();
      for (let i = 0; i < cols; i++) {
        const corrupt = i >= healthy;
        let ch = CONTEXT_TEXT.charAt(i % CONTEXT_TEXT.length);
        if (corrupt) {
          // corrupted region: scrambled glyphs, re-rolled slowly so it seethes
          const seed = (i * 31 + Math.floor(clockT() * 9) + b) % (U.GLYPHS.length || 1);
          ch = U.GLYPHS.charAt(seed);
        }
        ctx.fillStyle = corrupt
          ? U.hexA(C.corrupt, 0.55 + 0.35 * Math.sin(clockT() * 7 + i))
          : U.hexA(C.green, 0.82);
        // Every band draws the full line at the bar's centre; the clip above reveals
        // only this band's slice, so a per-band x offset reads as a glitch tear.
        ctx.fillText(ch, x + 6 + i * charW + off, ty);
      }
      ctx.restore();
    }

    // blinking block cursor at the end of the healthy region
    const blink = Math.floor(clockT() / Math.max(0.05, num(HUD.cursorBlink, 0.42))) % 2 === 0;
    if (blink && state() !== 'GAME_OVER') {
      ctx.fillStyle = U.hexA(C.green, 0.9);
      ctx.fillRect(x + 6 + healthy * charW, y + h * 0.5 - 8, charW * 0.8, 16);
    }
    ctx.restore();

    // label + percentage
    font(ctx, num(HUD.labelSize, 12));
    ctx.textAlign = 'left';
    ctx.fillStyle = U.hexA(C.dim, 1);
    ctx.fillText(String(HUD.integrityLabel || 'context integrity').toUpperCase(), x, y - 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = U.hexA(integ < num(TP.lowIntegrity, 30) ? C.red : C.green, 1);
    ctx.fillText(Math.round(integ) + '%', x + w, y - 8);
  }

  // ------------------------------------------------------------------- hud
  const mult = { squash: { v: 1, vel: 0 }, tier: 1, ringT: 99 };

  function hud(ctx) {
    const S = PI.Score;
    if (!S) return;
    // The title and death screens carry their own numbers; a live HUD behind them
    // reads as clutter (and would show "WAVE 0" before a run has started).
    const st = state();
    if (st !== 'PLAYING' && st !== 'PAUSED') return;
    const pad = num(HUD.pad, 24), top = num(HUD.topY, 40);

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.textBaseline = 'alphabetic';

    // score (tweened counter)
    const shown = S.display ? num(S.display.value, S.value) : num(S.value, 0);
    font(ctx, num(HUD.scoreSize, 34), 'bold');
    ctx.textAlign = 'left';
    ctx.fillStyle = U.hexA(C.white, 0.96);
    ctx.fillText(U.formatInt(Math.round(shown)), pad, top);
    font(ctx, num(HUD.labelSize, 12));
    ctx.fillStyle = U.hexA(C.dim, 1);
    ctx.fillText('SCORE', pad, top + 16);

    // high score
    ctx.textAlign = 'right';
    font(ctx, num(HUD.labelSize, 12));
    ctx.fillStyle = U.hexA(C.dim, 1);
    ctx.fillText('BEST ' + U.formatInt(num(S.high, 0)), W - pad, top - 18);

    // wave + accuracy
    font(ctx, num(HUD.waveSize, 16), 'bold');
    ctx.fillStyle = U.hexA(C.green, 0.9);
    const wv = PI.Entities ? num(PI.Entities.wave, 1) : 1;
    ctx.fillText('WAVE ' + wv, W - pad, top + 4);
    font(ctx, num(HUD.labelSize, 12));
    ctx.fillStyle = U.hexA(C.dim, 1);
    const acc = PI.Input ? Math.round(PI.Input.accuracy() * 100) : 100;
    ctx.fillText(acc + '% ACC', W - pad, top + 22);
    if (PI.Audio && PI.Audio.muted) {
      ctx.fillStyle = U.hexA(C.warn, 0.8);
      ctx.fillText('MUTED', W - pad, top + 40);
    }

    // combo + multiplier chip, centre-top
    const combo = num(S.combo, 0);
    if (combo > 0) {
      const m = typeof S.multiplier === 'function' ? S.multiplier() : 1;
      const tierColors = T.combo.tierColors || [C.white];
      const col = tierColors[Math.min(tierColors.length - 1, m - 1)] || C.white;
      const cx = W * 0.5;
      const sq = num(mult.squash.v, 1);

      ctx.save();
      ctx.translate(cx, top + 2);
      ctx.scale(sq, 2 - sq); // squash and stretch preserves visual mass
      font(ctx, num(HUD.comboSize, 40), 'bold');
      ctx.textAlign = 'center';
      ctx.fillStyle = U.hexA(col, 0.97);
      ctx.fillText(String(combo), 0, 0);
      ctx.restore();

      font(ctx, num(HUD.labelSize, 12));
      ctx.textAlign = 'center';
      ctx.fillStyle = U.hexA(C.dim, 1);
      ctx.fillText('COMBO', cx, top + 20);

      if (m > 1) {
        font(ctx, num(HUD.multSize, 22), 'bold');
        ctx.fillStyle = U.hexA(col, 0.96);
        ctx.fillText('x' + m, cx + 62, top - 2);
      }
      // tier-change ring pulse
      if (mult.ringT < num(T.combo.tierRingLife, 0.45)) {
        const k = mult.ringT / num(T.combo.tierRingLife, 0.45);
        ctx.strokeStyle = U.hexA(col, 0.7 * (1 - k));
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, top - 8, num(T.combo.tierRingR1, 90) * k, 0, TAU);
        ctx.stroke();
      }
      if (S.flow) {
        font(ctx, num(HUD.labelSize, 12), 'bold');
        ctx.fillStyle = U.hexA(C.cyan, 0.75 + 0.25 * Math.sin(clockT() * 8));
        ctx.fillText('FLOW STATE', cx, top - 26);
      }
    }

    // low-integrity heartbeat
    const integ = integrity();
    if (integ > 0 && integ < num(TP.lowIntegrity, 30) && state() === 'PLAYING') {
      const beat = 0.5 + 0.5 * Math.sin(clockT() * TAU / Math.max(0.2, num(J.heartbeatPeriod, 1.05)));
      if (lowLayer) {
        ctx.globalAlpha = num(J.heartbeatAmp, 0.3) * beat;
        ctx.drawImage(lowLayer, 0, 0);
        ctx.globalAlpha = 1;
      }
    }
  }

  // --------------------------------------------------------------- banners
  const banners = [];

  function showBanner(text, opts) {
    const o = opts || {};
    banners.push({
      text: String(text || ''),
      style: o.style || 'normal',
      t: 0,
      inT: num(o.in, num(J.bannerIn, 0.4)),
      hold: num(o.hold, num(J.bannerHold, 1)),
      outT: num(o.out, num(J.bannerOut, 0.32)),
      y: num(o.y, H * 0.42),
      size: num(o.size, o.style === 'alert' ? 40 : 52),
      color: o.color || (o.style === 'alert' ? C.red : C.green),
    });
    if (banners.length > 4) banners.shift();
  }

  function decodeText(ctx, text, x, y, progress, opts) {
    const o = opts || {};
    const shown = U.scramble(text, progress);
    font(ctx, num(o.size, 52), o.weight || 'bold');
    ctx.textAlign = o.align || 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = U.hexA(o.color || C.green, num(o.alpha, 1));
    ctx.fillText(shown, x, y);
    return shown;
  }

  function drawBanners(ctx) {
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < banners.length; i++) {
      const b = banners[i];
      const total = b.inT + b.hold + b.outT;
      if (b.t >= total) continue;
      let progress = 1, alpha = 1, dx = 0;
      if (b.t < b.inT) {
        progress = b.t / Math.max(0.01, b.inT);
        alpha = U.easeOutCubic(progress);
      } else if (b.t > b.inT + b.hold) {
        const k = (b.t - b.inT - b.hold) / Math.max(0.01, b.outT);
        alpha = 1 - U.easeInCubic(k);
        dx = U.easeInCubic(k) * 260;
      }

      if (b.style === 'alert') {
        const barA = alpha * 0.22;
        ctx.fillStyle = U.hexA(C.red, barA);
        ctx.fillRect(0, b.y - 44, W, 88);
      }

      // motion-blur ghosts on the way out (§11.5)
      if (dx > 1) {
        const ghosts = num(J.bannerGhosts, 3);
        for (let g = ghosts; g >= 1; g--) {
          decodeText(ctx, b.text, W * 0.5 + dx - g * 26, b.y, 1, {
            size: b.size, color: b.color, alpha: alpha * (0.16 / g),
          });
        }
      }
      decodeText(ctx, b.text, W * 0.5 + dx, b.y, progress, {
        size: b.size, color: b.color, alpha: alpha,
      });
    }
  }

  // --------------------------------------------------------------- screens
  const TITLE_TEXT = 'PROMPT INJECTION';
  const title = { letters: [], t: 0, ready: false };
  const API = {};

  function initTitle() {
    title.letters = [];
    const size = 76;
    const cw = size * 0.62;
    const totalW = TITLE_TEXT.length * cw;
    for (let i = 0; i < TITLE_TEXT.length; i++) {
      title.letters.push({
        ch: TITLE_TEXT.charAt(i),
        x: W * 0.5 - totalW * 0.5 + cw * (i + 0.5),
        delay: i * num(J.stagger, 0.04),
        landed: false,
        shake: 0,
      });
    }
    title.t = 0;
    title.ready = true;
  }

  function updateTitle(dt) {
    if (!title.ready) initTitle();
    title.t += dt;
    const fall = num(J.titleLetterFall, 0.5);
    let done = 0;
    for (let i = 0; i < title.letters.length; i++) {
      const L = title.letters[i];
      const local = title.t - L.delay;
      if (local >= fall) {
        done++;
        if (!L.landed) {
          L.landed = true;
          L.shake = num(J.titleLandShake, 0.09);
          // a spark burst as each letter slams home
          if (PI.FX) {
            PI.FX.spark(L.x, H * 0.3, {
              color: C.green, count: num(J.titleLandSparks, 5),
              speed: [40, 150], life: [0.2, 0.45], size: 2,
            });
          }
          if (PI.Audio && PI.Audio.uiTick) PI.Audio.uiTick();
        }
      }
      if (L.shake > 0) L.shake = Math.max(0, L.shake - dt);
    }
    API.titleAssembled = title.letters.length ? done / title.letters.length : 1;
  }

  function drawTitle(ctx) {
    const size = 76;
    const baseY = H * 0.3;
    const fall = num(J.titleLetterFall, 0.5);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < title.letters.length; i++) {
      const L = title.letters[i];
      const local = U.clamp((title.t - L.delay) / fall, 0, 1);
      if (local <= 0) continue;
      const ease = U.easeOutBack(local);
      const y = baseY - (1 - ease) * 300;
      const a = U.clamp(local * 1.6, 0, 1);
      const sh = L.shake > 0 ? Math.sin(L.shake * 120) * 3 * (L.shake / num(J.titleLandShake, 0.09)) : 0;
      font(ctx, size, 'bold');
      ctx.globalCompositeOperation = 'lighter';
      glow(ctx, L.x, y, 34, C.green, 0.16 * a);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = U.hexA(C.white, a);
      ctx.fillText(L.ch, L.x, y + sh);
    }

    if (API.titleAssembled >= 0.999) {
      // breathing subtitle
      const breath = 0.62 + num(J.titleSubtitleAmp, 0.28) *
        (0.5 + 0.5 * Math.sin(clockT() * TAU / Math.max(0.2, num(J.titleSubtitleBreath, 2.4))));
      font(ctx, 26, 'bold');
      ctx.fillStyle = U.hexA(C.green, breath);
      ctx.fillText('TYPE TO DEFEND', W * 0.5, H * 0.5);

      font(ctx, 15);
      ctx.fillStyle = U.hexA(C.dim, 1);
      const S = PI.Score;
      if (S && num(S.high, 0) > 0) {
        ctx.fillText('BEST ' + U.formatInt(S.high) + '   COMBO ' + U.formatInt(num(S.bestComboEver, S.highCombo || 0)),
          W * 0.5, H * 0.5 + 34);
      }
      // Sits under the high-score line: the turret occupies the bottom centre.
      ctx.fillStyle = U.hexA(C.white, 0.42);
      font(ctx, 14);
      ctx.fillText('designed by Fable 5  ·  built by Opus 5', W * 0.5, H * 0.5 + 88);
    }
  }

  function drawGameOver(ctx) {
    const S = PI.Score, I = PI.Input;
    ctx.fillStyle = U.hexA(C.ink, 0.88);
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    font(ctx, 30, 'bold');
    ctx.fillStyle = U.hexA(C.corrupt, 0.95);
    ctx.fillText('> context corrupted. ignore all previous instructions.', W * 0.5, H * 0.3);

    font(ctx, 64, 'bold');
    ctx.fillStyle = U.hexA(C.white, 0.97);
    ctx.fillText(U.formatInt(num(S && S.value, 0)), W * 0.5, H * 0.44);
    font(ctx, 13);
    ctx.fillStyle = U.hexA(C.dim, 1);
    ctx.fillText('SCORE', W * 0.5, H * 0.44 + 42);

    font(ctx, 18);
    ctx.fillStyle = U.hexA(C.green, 0.9);
    const acc = I ? Math.round(I.accuracy() * 100) : 0;
    const wv = PI.Entities ? num(PI.Entities.wave, 1) : 1;
    ctx.fillText('best combo ' + num(S && S.bestCombo, 0) + '   ·   ' + acc + '% accuracy   ·   wave ' + wv,
      W * 0.5, H * 0.56);

    if (S && S.isNewHigh) {
      const p = 0.7 + 0.3 * Math.sin(clockT() * 6);
      font(ctx, 26, 'bold');
      ctx.fillStyle = U.hexA(C.gold, p);
      ctx.fillText('NEW HIGH SCORE', W * 0.5, H * 0.64);
    }

    const blink = Math.floor(clockT() * 1.6) % 2 === 0;
    font(ctx, 20, 'bold');
    ctx.fillStyle = U.hexA(C.white, blink ? 0.9 : 0.35);
    ctx.fillText('[ENTER] retry', W * 0.5, H * 0.74);
  }

  function drawPaused(ctx) {
    ctx.fillStyle = U.hexA(C.ink, 0.62);
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    font(ctx, 30, 'bold');
    ctx.fillStyle = U.hexA(C.green, 0.9);
    ctx.fillText('paused — press any key', W * 0.5, H * 0.5);
  }

  function drawTouchCard(ctx) {
    ctx.fillStyle = U.hexA(C.ink, 0.92);
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    font(ctx, 34, 'bold');
    ctx.fillStyle = U.hexA(C.green, 0.95);
    ctx.fillText('this game needs a keyboard', W * 0.5, H * 0.46);
    font(ctx, 22);
    ctx.fillStyle = U.hexA(C.white, 0.8);
    ctx.fillText("that's the point 🎹", W * 0.5, H * 0.54);
  }

  function screens(ctx) {
    if (PI.Core && PI.Core.isTouchOnly) { drawTouchCard(ctx); return; }
    const s = state();
    if (s === 'TITLE') drawTitle(ctx);
    else if (s === 'GAME_OVER') drawGameOver(ctx);
    else if (s === 'PAUSED') drawPaused(ctx);
  }

  // --------------------------------------------------------------- overlay
  let scanPattern = null;

  function overlay(ctx) {
    ensureLayers();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    // chromatic aberration, flow state and boss death only — a cached tint layer
    // redrawn at a small offset, never per-pixel work.
    const flow = PI.Score && PI.Score.flow;
    if (flow && vignetteLayer) {
      const off = num(T.flow.chroma, 1.6);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.05;
      ctx.drawImage(vignetteLayer, -off, 0);
      ctx.drawImage(vignetteLayer, off, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    if (scanLayer) {
      if (!scanPattern) {
        try { scanPattern = ctx.createPattern(scanLayer, 'repeat'); } catch (_) { scanPattern = false; }
      }
      if (scanPattern) {
        ctx.fillStyle = scanPattern;
        ctx.fillRect(0, 0, W, H);
      }
    }

    // combo-break desaturation blink
    const S = PI.Score;
    if (S && num(S.breakFlash, 0) > 0) {
      const k = U.clamp(S.breakFlash / num(T.combo.breakDesaturate, 0.22), 0, 1);
      ctx.fillStyle = U.hexA(C.red, 0.1 * k);
      ctx.fillRect(0, 0, W, H);
    }

    if (PI.Core && !PI.Core.hasFocus && !PI.Core.isTouchOnly) {
      const blink = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(clockT() * TAU / Math.max(0.2, num(J.focusHintBlink, 1.1))));
      font(ctx, 16, 'bold');
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = U.hexA(C.white, blink);
      ctx.fillText('click to focus', W * 0.5, H - 26);
    }
  }

  // ---------------------------------------------------------------- update
  function update(dt) {
    const d = num(dt, 0);
    if (state() === 'TITLE') updateTitle(d);
    else if (!title.ready) initTitle();

    // turret spring toward the locked target, recoil recovery, flow afterimages
    U.spring(tur.rot, turretAngle(), d, num(TP.rotSpring.stiffness, 190), num(TP.rotSpring.damping, 19));
    if (tur.recoil > 0) tur.recoil = Math.max(0, tur.recoil - num(TP.recoilRecover, 14) * d);
    if (tur.muzzle > 0) tur.muzzle = Math.max(0, tur.muzzle - d);

    if (PI.Score && PI.Score.flow && PI.FX) {
      tur.afterT -= d;
      if (tur.afterT <= 0) {
        tur.afterT = num(TP.afterimageInterval, 0.045);
        PI.FX.afterimage(num(TP.turretX, 640), num(TP.turretY, 634), '▲', {
          color: C.cyan, life: num(TP.afterimageLife, 0.22), size: 22, alpha: 0.3,
        });
      }
    }

    // multiplier chip squash + tier ring
    const S = PI.Score;
    if (S) {
      const m = typeof S.multiplier === 'function' ? S.multiplier() : 1;
      if (m !== mult.tier) {
        mult.tier = m;
        mult.squash.v = num(T.combo.squash.to, 1.35);
        mult.squash.vel = 0;
        mult.ringT = 0;
      }
      U.spring(mult.squash, num(T.combo.squash.from, 1), d,
        num(T.combo.squash.stiffness, 320), num(T.combo.squash.damping, 15));
      if (mult.ringT < 90) mult.ringT += d;
    }

    if (glitch.t > 0) glitch.t = Math.max(0, glitch.t - d);

    for (let i = banners.length - 1; i >= 0; i--) {
      banners[i].t += d;
      if (banners[i].t >= banners[i].inT + banners[i].hold + banners[i].outT) banners.splice(i, 1);
    }
  }

  function resetScreens() {
    banners.length = 0;
    title.ready = false;
    glitch.t = 0;
  }

  API.background = background;
  API.enemies = enemies;
  API.turret = drawTurret;
  API.hud = hud;
  API.contextBar = contextBar;
  API.banners = drawBanners;
  API.screens = screens;
  API.overlay = overlay;
  API.update = update;
  API.showBanner = showBanner;
  API.glitchContext = glitchContext;
  API.decodeText = decodeText;
  API.fire = fire;
  API.resetScreens = resetScreens;
  API.titleAssembled = 0;
  return API;
})();

/* ==== 60-audio.js ==== */
// 60-audio.js — PI.Audio : 100% WebAudio synthesis (DESIGN.md §11 SFX + §13).
// No audio files, no fetch, no decodeAudioData. ONE AudioContext, created lazily
// inside init() (first keystroke — autoplay policy). Every public method is a
// no-op that never throws when the context is missing, suspended, closed or muted.
// Graph:  voices -> sfxBus ----\
//         music layers -> musicBus -> musicFilter -> master -> limiter -> out
PI.Audio = (function () {

  // ------------------------------------------------------------------ tuning
  const T = (PI.TUNING && PI.TUNING.audio) || {};
  const SCORE = (PI.TUNING && PI.TUNING.score) || {};

  function num(v, d) { return (typeof v === 'number' && isFinite(v)) ? v : d; }
  function list(v, d) { return (v && v.length) ? v : d; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function ratio(semi) { return Math.pow(2, semi / 12); }

  const MASTER_G = num(T.master, 0.42);
  const MUSIC_G = num(T.musicGain, 0.16);
  const SFX_G = num(T.sfxGain, 0.6);
  const BPM = num(T.bpm, 110);
  const SIXTEENTH = (60 / BPM) / 4;              // ~136ms at 110 BPM
  const BASS_F = num(T.bassNote, 55);            // Hz (A1), not a MIDI number
  const BASS_LEN = num(T.bassLen, 0.26);
  const PAD_F = num(T.padNote, 110);
  const ARP_NOTES = list(T.arpNotes, [0, 7, 12, 15, 19, 24]);
  const ARP_BASE = PAD_F * 2;                    // arpeggio sits an octave above the pad
  const ARP_G = num(T.arpGain, 0.1);
  const DRONE_F = num(T.droneNote, 41);
  const DRONE_G = num(T.droneGain, 0.09);
  const KEY_BASE = num(T.keyBase, 330);
  const KEY_LEN = num(T.keyLen, 0.045);
  const KEY_G = num(T.keyGain, 0.22);
  // §11: "pitch rises with each successive letter" — pentatonic so runs stay
  // musical; wraps after 8 steps. (TUNING.keyStep is a linear-Hz alternative,
  // kept in TUNING but unused: ratios sound better across the whole word.)
  const KEY_STEPS = [0, 2, 4, 7, 9, 12, 14, 16];
  const TYPO_F = num(T.typoFreq, 88);
  const TYPO_LEN = num(T.typoLen, 0.16);
  const TYPO_G = num(T.typoGain, 0.3);
  const KILL_SCALE = list(T.killScale, [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24, 27]);
  const KILL_BASE = num(T.killBase, 392);
  const KILL_LEN = num(T.killLen, 0.19);
  const KILL_G = num(T.killGain, 0.24);
  const EXP_LEN = num(T.explodeLen, 0.3);
  const EXP_G = num(T.explodeGain, 0.3);
  const BOSSHIT_LEN = num(T.bossHitLen, 0.26);
  const BOSSDIE_LEN = num(T.bossDieLen, 1.5);
  const LEAK_LEN = num(T.leakLen, 0.5);
  const LEAK_F = num(T.leakFreq, 130);
  const BREAK_LEN = num(T.comboBreakLen, 0.5);
  const TICK_F = num(T.uiTickFreq, 880);
  const TICK_LEN = num(T.uiTickLen, 0.03);
  const WAVE_LEN = num(T.waveStartLen, 0.4);
  const INTENSITY_TC = 1 / Math.max(0.2, num(T.intensityLerp, 2.2));
  const MUTE_KEY = (typeof SCORE.muteKey === 'string') ? SCORE.muteKey : 'pi_muted';

  const MAX_SFX = 24;          // concurrent sfx voices; extras are dropped
  const MAX_MUSIC = 20;
  const LOOKAHEAD = 0.2;       // schedule 200ms ahead...
  const TICK_MS = 25;          // ...from a 25ms setInterval scheduler (§13)
  const ARP_GATE = 0.5;        // arpeggio layer only plays at high intensity

  // one bar of 16ths; null = rest. Semitone offsets from BASS_F.
  const BASS_PAT = [0, null, null, null, 0, null, null, 7,
                    0, null, null, null, 5, null, 7, null];

  // ------------------------------------------------------------------- state
  let ctx = null, master = null, limiter = null, sfxBus = null;
  let musicBus = null, musicFilter = null;
  let bassG = null, hatG = null, arpG = null;
  let noiseBuf = null;
  let sfxVoices = 0, musicVoices = 0;
  let muted = false;
  let musicOn = false, schedId = 0, nextNote = 0, step = 0, bar = 0, arpI = 0;
  let intensity = 0;
  let drone = null;            // { a, b, c, gain, filter } or null

  try {
    muted = (window.localStorage && window.localStorage.getItem(MUTE_KEY) === '1');
  } catch (_) { muted = false; }

  // -------------------------------------------------------------- graph/init
  function makeNoise() {
    // 2s of white noise, generated once and looped by every noise voice.
    const len = Math.floor(ctx.sampleRate * 2);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function init() {
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        ctx = new AC();

        limiter = ctx.createDynamicsCompressor();
        limiter.threshold.value = -8;
        limiter.knee.value = 6;
        limiter.ratio.value = 12;
        limiter.attack.value = 0.003;
        limiter.release.value = 0.18;
        limiter.connect(ctx.destination);

        master = ctx.createGain();
        master.gain.value = muted ? 0.0001 : MASTER_G;
        master.connect(limiter);

        sfxBus = ctx.createGain();
        sfxBus.gain.value = SFX_G;
        sfxBus.connect(master);

        musicFilter = ctx.createBiquadFilter();
        musicFilter.type = 'lowpass';
        musicFilter.frequency.value = 900 + 2600 * intensity;
        musicFilter.Q.value = 0.7;
        musicFilter.connect(master);

        musicBus = ctx.createGain();
        musicBus.gain.value = musicOn ? MUSIC_G : 0.0001;
        musicBus.connect(musicFilter);

        bassG = ctx.createGain(); bassG.gain.value = 1;
        hatG = ctx.createGain(); hatG.gain.value = 0.28 + 0.72 * intensity;
        arpG = ctx.createGain(); arpG.gain.value = intensity < ARP_GATE ? 0.0001 : 1;
        bassG.connect(musicBus); hatG.connect(musicBus); arpG.connect(musicBus);

        noiseBuf = makeNoise();
      }
      if (ctx.state === 'suspended' || ctx.state === 'interrupted') ctx.resume();
      if (musicOn && !schedId) startSched();
      return true;
    } catch (_) { return false; }
  }

  function nowT() { return ctx ? ctx.currentTime : 0; }

  function ready() {
    if (!ctx || muted) return false;
    const st = ctx.state;
    if (st === 'closed') return false;
    if (st === 'suspended' || st === 'interrupted') {
      try { ctx.resume(); } catch (_) { }
      return false;                      // drop this one event rather than pile up
    }
    return true;
  }

  // ------------------------------------------------------------ voice plumbing
  function drop(src, chain) {
    try { src.disconnect(); } catch (_) { }
    for (let i = 0; i < chain.length; i++) { try { chain[i].disconnect(); } catch (_) { } }
  }

  // Starts + stops every node it is given and disconnects the whole chain when
  // the source ends, so nothing leaks. Past the voice cap the voice is dropped.
  function spawn(src, chain, t0, dur, isMusic, offset) {
    if (isMusic ? (musicVoices >= MAX_MUSIC) : (sfxVoices >= MAX_SFX)) {
      drop(src, chain);
      return false;
    }
    if (isMusic) musicVoices++; else sfxVoices++;
    let done = false;
    function fin() {
      if (done) return;
      done = true;
      if (isMusic) { musicVoices = Math.max(0, musicVoices - 1); }
      else { sfxVoices = Math.max(0, sfxVoices - 1); }
      drop(src, chain);
    }
    src.onended = fin;
    try {
      if (src.buffer) src.start(t0, offset || 0); else src.start(t0);
      src.stop(t0 + dur);
    } catch (_) { fin(); return false; }
    // safety net in case 'ended' never fires (context closed mid-flight)
    try { setTimeout(fin, Math.max(60, (t0 - nowT() + dur + 0.35) * 1000)); } catch (_) { }
    return true;
  }

  function envelope(p, t0, dur, peak, atk, hold) {
    const pk = Math.max(0.0002, peak);
    const a = Math.min(Math.max(0.001, atk), dur * 0.5);
    try {
      p.setValueAtTime(0.0001, t0);
      p.linearRampToValueAtTime(pk, t0 + a);
      if (hold > 0) p.setValueAtTime(pk, t0 + Math.min(dur * 0.9, a + hold));
      p.exponentialRampToValueAtTime(0.0001, t0 + dur);
    } catch (_) { }
  }

  // filter tail shared by tone()/noise(): o.filter type, o.fc start, o.fc1 end, o.q
  function filterTail(g, dest, t0, dur, o, chain) {
    if (!o.filter) { g.connect(dest); return; }
    const bq = ctx.createBiquadFilter();
    bq.type = o.filter;
    bq.frequency.setValueAtTime(Math.max(30, num(o.fc, 900)), t0);
    if (o.fc1) {
      try { bq.frequency.exponentialRampToValueAtTime(Math.max(30, o.fc1), t0 + dur); } catch (_) { }
    }
    if (o.q) bq.Q.value = o.q;
    g.connect(bq); bq.connect(dest);
    chain.push(bq);
  }

  function tone(type, f0, f1, t0, dur, peak, dest, o) {
    if (!ctx || !ready()) return null;
    o = o || {};
    let osc, g;
    try { osc = ctx.createOscillator(); g = ctx.createGain(); } catch (_) { return null; }
    osc.type = type;
    const chain = [g];
    osc.connect(g);
    filterTail(g, dest || sfxBus, t0, dur, o, chain);
    try {
      osc.frequency.setValueAtTime(Math.max(8, f0), t0);
      if (f1 && f1 !== f0) {
        const te = t0 + dur * num(o.sweepT, 1);
        if (o.linear) osc.frequency.linearRampToValueAtTime(Math.max(8, f1), te);
        else osc.frequency.exponentialRampToValueAtTime(Math.max(8, f1), te);
      }
      if (o.detune) osc.detune.value = o.detune;
    } catch (_) { }
    envelope(g.gain, t0, dur, peak, num(o.attack, 0.004), num(o.hold, 0));
    if (!spawn(osc, chain, t0, dur + 0.02, o.music)) return null;
    return g;
  }

  function noise(t0, dur, peak, dest, o) {
    if (!ctx || !noiseBuf || !ready()) return null;
    o = o || {};
    let src, g;
    try { src = ctx.createBufferSource(); g = ctx.createGain(); } catch (_) { return null; }
    src.buffer = noiseBuf;
    src.loop = true;
    try {
      if (o.rate) src.playbackRate.setValueAtTime(Math.max(0.05, o.rate), t0);
      if (o.rate1) src.playbackRate.exponentialRampToValueAtTime(Math.max(0.05, o.rate1), t0 + dur);
    } catch (_) { }
    const chain = [g];
    src.connect(g);
    filterTail(g, dest || sfxBus, t0, dur, o, chain);
    envelope(g.gain, t0, dur, peak, num(o.attack, 0.003), num(o.hold, 0));
    if (!spawn(src, chain, t0, dur + 0.02, o.music, rnd(0, 1.5))) return null;
    return g;
  }

  // ------------------------------------------------------------------ SFX §11
  // Correct keystroke: short pulse blip, pitch rises with the letter index.
  function key(stepIdx) {
    if (!ready()) return;
    const t = nowT() + 0.003;
    const i = Math.abs(Math.floor(num(stepIdx, 0))) % KEY_STEPS.length;
    const f = KEY_BASE * ratio(KEY_STEPS[i]);
    tone('square', f, f * 1.06, t, KEY_LEN + 0.03, KEY_G, sfxBus,
      { attack: 0.001, filter: 'lowpass', fc: 5200, q: 0.8 });
    tone('triangle', f * 2, f * 2, t, KEY_LEN * 0.6, KEY_G * 0.25, sfxBus, { attack: 0.001 });
  }

  // Typo: harsh low buzz + a noise slap (§11 "unmissable").
  function typo() {
    if (!ready()) return;
    const t = nowT() + 0.003;
    tone('sawtooth', TYPO_F, TYPO_F * 0.86, t, TYPO_LEN, TYPO_G, sfxBus,
      { attack: 0.001, filter: 'lowpass', fc: 700, fc1: 260, q: 4 });
    tone('square', TYPO_F * 1.5, TYPO_F * 1.4, t, TYPO_LEN * 0.8, TYPO_G * 0.45, sfxBus,
      { attack: 0.001, detune: 22, filter: 'lowpass', fc: 900 });
    noise(t, 0.07, TYPO_G * 0.6, sfxBus, { attack: 0.001, filter: 'bandpass', fc: 240, q: 1.4 });
  }

  // Kill: noise burst + pitched chime that walks a scale with the combo, so a
  // streak literally plays a melody (§11).
  function kill(stepIdx) {
    if (!ready()) return;
    const t = nowT() + 0.003;
    const i = Math.abs(Math.floor(num(stepIdx, 0))) % KILL_SCALE.length;
    const f = KILL_BASE * ratio(KILL_SCALE[i]);
    noise(t, 0.085, 0.42, sfxBus, { attack: 0.001, filter: 'highpass', fc: 1500, fc1: 5200 });
    tone('triangle', f, f, t, KILL_LEN, KILL_G, sfxBus, { attack: 0.002 });
    tone('sine', f * 2, f * 2, t, KILL_LEN * 0.7, KILL_G * 0.45, sfxBus, { attack: 0.001 });
    tone('sine', f * 3.01, f * 3.01, t + 0.008, KILL_LEN * 0.4, KILL_G * 0.16, sfxBus, { attack: 0.001 });
  }

  // size: 'basic' | 'elite' | 'boss' | a scalar (a big number reads as pixels).
  function sizeOf(size) {
    if (typeof size === 'string') {
      if (size === 'boss') return 1.6;
      if (size === 'elite') return 1.15;
      if (size === 'basic') return 0.8;
      return 1;
    }
    const s = num(size, 1);
    return clamp(s > 3 ? s / 40 : s, 0.5, 2.2);
  }

  function explode(size) {
    if (!ready()) return;
    const s = sizeOf(size);
    const t = nowT() + 0.003;
    const dur = EXP_LEN * (0.7 + 0.55 * s);
    noise(t, dur, EXP_G * (0.7 + 0.4 * s), sfxBus,
      { attack: 0.002, filter: 'lowpass', fc: 2400 * s, fc1: 160, q: 1.1, rate: 1.15, rate1: 0.55 });
    tone('sine', 190 * s, 34, t, dur * 0.92, EXP_G * 0.85, sfxBus, { attack: 0.002 });
    tone('sawtooth', 130 * s, 42, t, dur * 0.5, EXP_G * 0.24, sfxBus,
      { attack: 0.001, filter: 'lowpass', fc: 950, fc1: 130 });
  }

  // Boss intro klaxon: two-tone saw sweep, three cycles (§11.5 boss intro).
  function klaxon() {
    if (!ready()) return;
    const t = nowT() + 0.004;
    for (let i = 0; i < 3; i++) {
      const a = t + i * 0.3;
      tone('sawtooth', 520, 700, a, 0.15, 0.24, sfxBus,
        { attack: 0.012, filter: 'bandpass', fc: 900, q: 2.6 });
      tone('sawtooth', 522, 702, a, 0.15, 0.12, sfxBus,
        { attack: 0.012, detune: -18, filter: 'bandpass', fc: 1400, q: 2.2 });
      tone('sawtooth', 700, 520, a + 0.15, 0.15, 0.24, sfxBus,
        { attack: 0.012, filter: 'bandpass', fc: 900, q: 2.6 });
    }
    tone('sine', 70, 52, t, 0.9, 0.22, sfxBus, { attack: 0.02, hold: 0.4 });
  }

  // Boss word destroyed: heavy metallic thunk.
  function bossHit() {
    if (!ready()) return;
    const t = nowT() + 0.003;
    tone('sine', 260, 62, t, BOSSHIT_LEN, 0.34, sfxBus, { attack: 0.002 });
    tone('square', 180, 90, t, BOSSHIT_LEN * 0.5, 0.12, sfxBus,
      { attack: 0.001, filter: 'lowpass', fc: 1200, fc1: 400 });
    noise(t, BOSSHIT_LEN * 0.7, 0.34, sfxBus,
      { attack: 0.001, filter: 'bandpass', fc: 1900, fc1: 700, q: 3.5 });
    tone('triangle', 1320, 990, t, 0.12, 0.09, sfxBus, { attack: 0.001 });
  }

  // Boss death: long descending sweep + noise wash + a closing boom (§11.5).
  function bossDie() {
    if (!ready()) return;
    const t = nowT() + 0.004;
    const d = BOSSDIE_LEN;
    tone('sawtooth', 880, 55, t, d, 0.3, sfxBus,
      { attack: 0.01, filter: 'lowpass', fc: 3200, fc1: 220, q: 2 });
    tone('square', 660, 41, t + 0.02, d * 0.95, 0.11, sfxBus,
      { attack: 0.01, detune: 14, filter: 'lowpass', fc: 1800, fc1: 200 });
    noise(t, d * 1.05, 0.3, sfxBus,
      { attack: 0.01, filter: 'lowpass', fc: 5200, fc1: 200, rate: 1.5, rate1: 0.35 });
    tone('sine', 1760, 1230, t, d * 0.75, 0.06, sfxBus, { attack: 0.02 });
    // final impact once the sweep bottoms out
    const b = t + d * 0.62;
    tone('sine', 120, 30, b, 0.75, 0.36, sfxBus, { attack: 0.003 });
    noise(b, 0.5, 0.26, sfxBus, { attack: 0.002, filter: 'lowpass', fc: 1400, fc1: 120 });
  }

  // Combo break: glass shatter — noise + a high resonant band, fast decay (§9).
  function comboBreak() {
    if (!ready()) return;
    const t = nowT() + 0.003;
    noise(t, 0.07, 0.5, sfxBus, { attack: 0.001, filter: 'highpass', fc: 2600 });
    noise(t, BREAK_LEN, 0.24, sfxBus,
      { attack: 0.001, filter: 'bandpass', fc: 3800, fc1: 2100, q: 12, rate: 1.1, rate1: 0.8 });
    for (let i = 0; i < 4; i++) {
      const f = rnd(1900, 3400);
      tone('triangle', f, f * 0.82, t + 0.015 + i * 0.045, 0.13, 0.085, sfxBus, { attack: 0.001 });
    }
    tone('sine', 180, 66, t, 0.3, 0.2, sfxBus, { attack: 0.002 });
  }

  // FLOW STATE in: bright rising arpeggio (§9/§11.5).
  function flowStart() {
    if (!ready()) return;
    const t = nowT() + 0.004;
    const steps = [0, 4, 7, 12, 16, 19];
    for (let i = 0; i < steps.length; i++) {
      const f = 440 * ratio(steps[i]);
      const a = t + i * 0.055;
      tone('square', f, f, a, 0.22, 0.15, sfxBus,
        { attack: 0.002, filter: 'lowpass', fc: 4200, q: 1 });
      tone('triangle', f * 2, f * 2, a, 0.16, 0.07, sfxBus, { attack: 0.001 });
    }
    noise(t, 0.4, 0.14, sfxBus, { attack: 0.12, filter: 'highpass', fc: 2000, fc1: 8000 });
  }

  // FLOW STATE out: record-scratch-ish downward noise sweep.
  function flowEnd() {
    if (!ready()) return;
    const t = nowT() + 0.003;
    noise(t, 0.42, 0.32, sfxBus,
      { attack: 0.004, filter: 'bandpass', fc: 3200, fc1: 220, q: 5, rate: 1.7, rate1: 0.25 });
    tone('sawtooth', 520, 90, t, 0.36, 0.16, sfxBus,
      { attack: 0.004, filter: 'lowpass', fc: 2400, fc1: 300 });
  }

  // temp=0 : crystalline chime cluster (§10 freeze).
  function freeze() {
    if (!ready()) return;
    const t = nowT() + 0.004;
    const f = [1568, 2093, 2637, 3136, 3520];
    for (let i = 0; i < f.length; i++) {
      const a = t + i * 0.035;
      tone('sine', f[i], f[i] * 0.998, a, 0.7 - i * 0.06, 0.11, sfxBus, { attack: 0.002 });
      tone('sine', f[i] * 2.002, f[i] * 2, a, 0.22, 0.03, sfxBus, { attack: 0.001 });
    }
    noise(t, 0.5, 0.1, sfxBus, { attack: 0.05, filter: 'highpass', fc: 6000 });
    tone('sine', 196, 174, t, 0.6, 0.1, sfxBus, { attack: 0.02 });
  }

  // rlhf : popcorn cascade matching the staggered enemy explosions (§10 purge).
  function purge() {
    if (!ready()) return;
    const t = nowT() + 0.004;
    for (let i = 0; i < 10; i++) {
      const a = t + i * 0.055;
      noise(a, 0.075, 0.24, sfxBus,
        { attack: 0.001, filter: 'bandpass', fc: 700 + i * 260, q: 2.2, rate: 1 + i * 0.06 });
      tone('square', 220 * ratio(i * 2), 140, a, 0.06, 0.07, sfxBus, { attack: 0.001 });
    }
    tone('sine', 110, 55, t, 0.5, 0.2, sfxBus, { attack: 0.004 });
  }

  // stop : a snap (§10 stop sequence).
  function stopSeq() {
    if (!ready()) return;
    const t = nowT() + 0.003;
    noise(t, 0.05, 0.5, sfxBus, { attack: 0.0008, filter: 'highpass', fc: 3000 });
    tone('square', 900, 170, t, 0.055, 0.2, sfxBus, { attack: 0.0008 });
    tone('sine', 150, 60, t, 0.14, 0.16, sfxBus, { attack: 0.002 });
  }

  // A golden system command was completed: bright, obviously-good chime pair.
  function command() {
    if (!ready()) return;
    const t = nowT() + 0.004;
    tone('triangle', 880, 880, t, 0.2, 0.16, sfxBus, { attack: 0.002 });
    tone('triangle', 1320, 1320, t + 0.07, 0.3, 0.14, sfxBus, { attack: 0.002 });
    tone('sine', 1760, 1760, t + 0.14, 0.35, 0.08, sfxBus, { attack: 0.002 });
    noise(t, 0.28, 0.1, sfxBus, { attack: 0.02, filter: 'highpass', fc: 4500, fc1: 9000 });
  }

  function uiTick() {
    if (!ready()) return;
    const t = nowT() + 0.002;
    tone('sine', TICK_F, TICK_F * 0.94, t, TICK_LEN + 0.02, 0.11, sfxBus, { attack: 0.001 });
  }

  // Wave banner sting (§8 breather).
  function waveStart() {
    if (!ready()) return;
    const t = nowT() + 0.003;
    tone('triangle', 440, 440, t, WAVE_LEN * 0.45, 0.14, sfxBus, { attack: 0.003 });
    tone('triangle', 660, 660, t + WAVE_LEN * 0.4, WAVE_LEN * 0.6, 0.14, sfxBus, { attack: 0.003 });
    noise(t, WAVE_LEN * 0.5, 0.08, sfxBus, { attack: 0.08, filter: 'highpass', fc: 3000, fc1: 7000 });
  }

  // NEW HIGH SCORE: triumphant 4-note motif (§9).
  function highScore() {
    if (!ready()) return;
    const t = nowT() + 0.004;
    const steps = [0, 4, 7, 12];
    for (let i = 0; i < steps.length; i++) {
      const f = 523.25 * ratio(steps[i]);
      const a = t + i * 0.14;
      const last = (i === steps.length - 1);
      tone('square', f, f, a, last ? 0.9 : 0.2, 0.14, sfxBus,
        { attack: 0.004, hold: last ? 0.3 : 0.04, filter: 'lowpass', fc: 4600, q: 0.9 });
      tone('triangle', f * 1.5, f * 1.5, a, last ? 0.8 : 0.18, 0.07, sfxBus, { attack: 0.004 });
    }
    noise(t + 0.42, 0.7, 0.1, sfxBus, { attack: 0.2, filter: 'highpass', fc: 3500, fc1: 9000 });
  }

  // Enemy injected itself into the context: low detuned drop + corruption hiss.
  function leak() {
    if (!ready()) return;
    const t = nowT() + 0.003;
    tone('sawtooth', LEAK_F, 45, t, LEAK_LEN, 0.3, sfxBus,
      { attack: 0.003, filter: 'lowpass', fc: 1400, fc1: 200, q: 2 });
    tone('sawtooth', LEAK_F * 1.01, 44, t, LEAK_LEN, 0.16, sfxBus,
